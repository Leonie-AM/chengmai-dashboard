<title>诚迈科技对外投资看板（独立版）</title>

<style>

* { margin:0; padding:0; box-sizing:border-box; }

body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif; background:#f0f2f5; color:#333; min-height:100vh; }



/* ── 顶部 ── */

.header { background: linear-gradient(135deg, #1a237e 0%, #283593 100%); color:#fff; padding:20px 32px; }

.header h1 { font-size:22px; font-weight:600; }

.header .sub { font-size:13px; opacity:.7; margin-top:4px; }



/* ── 标签导航 ── */

.tab-btn { padding:7px 20px; border:1px solid rgba(255,255,255,.3); border-radius:6px; background:rgba(255,255,255,.1); color:#fff; cursor:pointer; font-size:13px; transition:all .2s; }

.tab-btn:hover { background:rgba(255,255,255,.2); }

.tab-btn.active { background:#fff; color:#1a237e; font-weight:600; border-color:#fff; }



/* ── 评分等级徽章 ── */

.grade-badge { display:inline-block; padding:3px 12px; border-radius:12px; font-size:12px; font-weight:600; min-width:36px; text-align:center; }

.grade-A { background:#e8f5e9; color:#2e7d32; }

.grade-B { background:#e3f2fd; color:#1565c0; }

.grade-C { background:#fff8e1; color:#f57f17; }

.grade-D { background:#fce4ec; color:#c62828; }

.grade-E { background:#fff3e0; color:#e65100; }

.grade-F { background:#f5f5f5; color:#9e9e9e; }

.grade-参股 { background:#f3e5f5; color:#6a1b9a; }



/* ── 数据覆盖条 ── */

.coverage-bar { display:flex; align-items:center; gap:6px; }

.coverage-bar .bar-bg { flex:1; height:6px; background:#e0e0e0; border-radius:3px; overflow:hidden; min-width:60px; }

.coverage-bar .bar-fill { height:100%; border-radius:3px; transition:width .3s; }

.coverage-bar .val { font-size:11px; color:#888; white-space:nowrap; }



/* ── 红牌标记 ── */

.red-card-dot { display:inline-block; width:8px; height:8px; background:#e53935; border-radius:50%; }



/* ── 统计卡片 ── */

.stats-row { display:flex; gap:16px; padding:20px 32px; margin-top:-10px; }

.stat-card { flex:1; background:#fff; border-radius:10px; padding:18px 20px; box-shadow:0 1px 4px rgba(0,0,0,.08); display:flex; align-items:center; gap:14px; }

.stat-card .icon { width:44px; height:44px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:20px; }

.stat-card .icon.blue { background:#e3f2fd; color:#1565c0; }

.stat-card .icon.green { background:#e8f5e9; color:#2e7d32; }

.stat-card .icon.orange { background:#fff3e0; color:#e65100; }

.stat-card .icon.purple { background:#f3e5f5; color:#6a1b9a; }

.stat-card .val { font-size:26px; font-weight:700; }

.stat-card .lbl { font-size:12px; color:#888; margin-top:2px; }



/* ── 主布局 ── */

.main { display:flex; gap:16px; padding:0 32px 24px; }

.sidebar { width:220px; flex-shrink:0; }

.content { flex:1; min-width:0; }



/* ── 搜索栏 ── */

.search-box { background:#fff; border-radius:10px; padding:16px 20px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:16px; }

.search-box input { width:100%; border:1px solid #e0e0e0; border-radius:8px; padding:10px 14px; font-size:14px; outline:none; transition:border .2s; }

.search-box input:focus { border-color:#1a237e; }



/* ── 筛选面板 ── */

.filter-panel { background:#fff; border-radius:10px; padding:0; box-shadow:0 1px 4px rgba(0,0,0,.08); overflow:hidden; }

.filter-panel-header { display:flex; align-items:center; justify-content:space-between; padding:12px 14px 10px; border-bottom:1px solid #f0f0f0; }

.filter-panel-header h3 { font-size:13px; font-weight:600; color:#444; margin:0; }

.filter-panel-header .reset-all { font-size:11px; color:#1a237e; cursor:pointer; padding:2px 8px; border-radius:4px; border:1px solid #c5cae9; background:#f3f4fb; transition:all .15s; }

.filter-panel-header .reset-all:hover { background:#e8eaf6; }

.filter-group { border-bottom:1px solid #f5f5f5; padding:10px 14px; }

.filter-group:last-child { border-bottom:none; }

.filter-group-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }

.filter-group-header .title { font-size:12px; color:#666; font-weight:600; display:flex; align-items:center; gap:5px; }

.filter-group-header .badge { display:inline-flex; align-items:center; justify-content:center; min-width:18px; height:18px; padding:0 5px; border-radius:9px; font-size:10px; font-weight:700; background:#1a237e; color:#fff; line-height:1; }

.filter-group-header .clear-group { font-size:11px; color:#e53935; cursor:pointer; padding:1px 6px; border-radius:4px; border:1px solid #ffcdd2; background:#fff8f8; transition:all .15s; display:none; }

.filter-group-header .clear-group:hover { background:#fce4ec; }

.filter-group-header .clear-group.visible { display:inline-block; }

.filter-group .tags { display:flex; flex-wrap:wrap; gap:5px; }

.filter-tag { padding:3px 9px; border-radius:12px; font-size:12px; cursor:pointer; border:1px solid #e0e0e0; background:#fafafa; color:#666; transition:all .15s; user-select:none; line-height:1.5; }

.filter-tag:hover { border-color:#3f51b5; color:#3f51b5; background:#f0f2ff; }

.filter-tag.active { background:#1a237e; color:#fff; border-color:#1a237e; }

.filter-tag.active:hover { background:#283593; }

  .filter-group .show-more { font-size:11px; color:#1a237e; cursor:pointer; margin-top:5px; display:inline-flex; align-items:center; gap:2px; padding:2px 0; }



/* ── 总览页样式 ── */

#overview-topbar { background:linear-gradient(135deg,#1a237e 0%,#283593 100%); color:#fff; padding:10px 28px; display:flex; align-items:center; justify-content:space-between; box-shadow:0 2px 8px rgba(0,0,0,.15); }

.ov-chart-grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; }

.ov-chart-grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; margin-bottom:20px; }

.ov-card { background:#fff; border-radius:12px; padding:20px; box-shadow:0 2px 8px rgba(0,0,0,.06); transition:box-shadow .2s; }

.ov-card:hover { box-shadow:0 4px 16px rgba(0,0,0,.1); }

.ov-card h3 { font-size:14px; font-weight:600; color:#333; margin-bottom:14px; display:flex; align-items:center; gap:8px; }

.ov-card h3 .dot { width:8px; height:8px; border-radius:50%; }

.ov-table-wrap { max-height:360px; overflow-y:auto; }

.ov-table-wrap table { width:100%; border-collapse:collapse; font-size:13px; }

.ov-table-wrap thead th { position:sticky; top:0; background:#f5f7fa; padding:8px 10px; text-align:left; color:#666; font-weight:600; border-bottom:2px solid #e8e8e8; font-size:12px; }

.ov-table-wrap tbody td { padding:8px 10px; border-bottom:1px solid #f0f0f0; }

.ov-table-wrap tbody tr:hover { background:#fafbff; }

.rank-badge { display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; border-radius:50%; font-size:11px; font-weight:700; color:#fff; }

.rank-1 { background:#f9a825; }

.rank-2 { background:#90a4ae; }

.rank-3 { background:#a1887f; }

.rank-other { background:#e0e0e0; color:#888; }

.filter-group .show-more:hover { text-decoration:underline; }



/* ── 表格 ── */

.table-wrap { background:#fff; border-radius:10px; box-shadow:0 1px 4px rgba(0,0,0,.08); overflow:hidden; }

.table-header { display:flex; align-items:center; justify-content:space-between; padding:14px 20px; border-bottom:1px solid #f0f0f0; }

.table-header .count { font-size:14px; color:#555; }

.table-header .count strong { color:#1a237e; }

.table-scroll { overflow-x:auto; }

table { width:100%; border-collapse:collapse; font-size:13px; }

th { background:#fafafa; padding:10px 14px; text-align:left; font-weight:600; color:#555; white-space:nowrap; border-bottom:1px solid #e8e8e8; cursor:pointer; user-select:none; }

th:hover { background:#f0f0f0; }

th .sort-arrow { margin-left:4px; font-size:10px; }

td { padding:9px 14px; border-bottom:1px solid #f5f5f5; }

tr:hover td { background:#f8f9ff; cursor:pointer; }

.status-badge { display:inline-block; padding:2px 10px; border-radius:10px; font-size:11px; font-weight:500; }

.status-badge.normal { background:#e8f5e9; color:#2e7d32; }

const REVENUE_RANGE_MAP = {
  '1000万以下':   [null, 1000],
  '1000万-2000万': [1000, 2000],
  '2000万-5000万': [2000, 5000],
  '5000万-1亿':   [5000, 10000],

function _filterList(list, params) {
  let result = [...list];
  const search = params.get('search');
  if (search) {
    const q = search.toLowerCase();
    result = result.filter(r =>
      (r['公司名称'] || '').toLowerCase().includes(q) ||
      (r['简称'] || '').toLowerCase().includes(q)
    );
  }
  for (const key of ['类别', '经营状态', '独立经营', '体系平台', '地域', '政府投资协议', '招商承诺', 'grade']) {
    const val = params.get(key);
    if (val) {
      const vals = val.split(',').map(v => v.trim()).filter(Boolean);
      if (key === 'grade') {
        // 评分等级筛选：从 embedded grade 字段匹配，参股公司用 is_cangu 判断
        const hasCangu = vals.includes('参股');
        result = result.filter(r => {
          if (hasCangu && r['is_cangu']) return true;
          return vals.includes(r['grade'] || '');
        });
      } else if (vals.length === 1) {
        result = result.filter(r => (r[key] || '') === vals[0]);
      } else if (vals.length > 1) {
        result = result.filter(r => vals.includes(r[key] || ''));
      }
    }
  }
  const revenueRange = params.get('revenue_range');
  const revenueYear = params.get('revenue_year');
  if (revenueRange && revenueYear) {
    const ranges = revenueRange.split(',').map(v => v.trim()).filter(Boolean);
    const yearNum = parseInt(revenueYear);
    result = result.filter(r => {
      const revData = r['revenue_data'] || {};
      let rev = revData[yearNum];
      // 没有营收数据归入1000万以下
      if (rev == null) rev = 0;
      for (const range of ranges) {
        const bounds = REVENUE_RANGE_MAP[range];
        if (!bounds) continue;
        const [lo, hi] = bounds;
        if ((lo == null || rev >= lo) && (hi == null || rev < hi)) return true;
      }
      return false;
    });
  }
  const ipFilter = params.get('ip_filter');
  if (ipFilter) {
    const ipTypes = ipFilter.split(',');
    result = result.filter(r => {
      const qd = r._qcc_data || {};
      // AND logic: must have ALL selected IP types
      for (let i = 0; i < ipTypes.length; i++) {
        const t = ipTypes[i];
        if (t === '专利' && !(qd.patentCount && qd.patentCount > 0)) return false;
        if (t === '软著' && !(qd.softCopyrightCount && qd.softCopyrightCount > 0)) return false;
        if (t === '荣誉资质' && !(qd.honors && qd.honors.length > 0)) return false;
        if (t === '资质证书' && !(qd.certificates && qd.certificates.length > 0)) return false;
      }
      return true;
    });
  }
  const sort = params.get('sort') || '序号';
  const order = params.get('order') || 'asc';
  const dir = order === 'desc' ? -1 : 1;
  result.sort((a, b) => {
    let va = a[sort], vb = b[sort];
    if (sort === '注册资本_万元') { va = va || 0; vb = vb || 0; }
    if (va == null && vb == null) return 0;
    if (va == null) return 1;
    if (vb == null) return -1;
    if (typeof va === 'string') va = va.toLowerCase();
    if (typeof vb === 'string') vb = vb.toLowerCase();
    return (va < vb ? -1 : va > vb ? 1 : 0) * dir;
  });
  const page = Math.max(1, parseInt(params.get('page')) || 1);
  const limit = Math.max(1, Math.min(100, parseInt(params.get('limit')) || 30));
  const total = result.length;
  const pages = Math.ceil(total / limit);
  const skip = (page - 1) * limit;
  const data = result.slice(skip, skip + limit);
  return { total, page, limit, pages, data };
}

async function api(path) {
  let url;
  try {
    url = new URL(path, window.location.origin || 'http://127.0.0.1:5000');
  } catch(e) {
    url = new URL('http://127.0.0.1:5000' + path);
  }
  const params = new URLSearchParams(url.search);
  const pathOnly = url.pathname;

  if (pathOnly === '/api/stats' || path === '/api/stats')
    return __DATA__.stats;

  if (pathOnly === '/api/filters' || path === '/api/filters')
    return __DATA__.filters;

  if (pathOnly === '/api/score-summary' || path === '/api/score-summary')
    return __DATA__.scoreSummary;

  const companyIdMatch = pathOnly.match(/^\/api\/companies\/([^\/]+)$/);
  if (companyIdMatch) {
    const rawId = companyIdMatch[1];
    const decodedId = (function() { try { return decodeURIComponent(rawId); } catch(e) { return rawId; } })();
    const detail = __DATA__.companyDetails[decodedId] || __DATA__.companyDetails[rawId];
    if (!detail) throw new Error('公司不存在');
    return detail;
  }

  if (pathOnly === '/api/companies')
    return _filterList(__DATA__.allCompanies, params);

  const scoreIdMatch = pathOnly.match(/^\/api\/scores\/([^\/]+)$/);
  if (scoreIdMatch) {
    const rawId = scoreIdMatch[1];
    const decodedId = (function() { try { return decodeURIComponent(rawId); } catch(e) { return rawId; } })();
    const detail = __DATA__.scoreDetails[decodedId] || __DATA__.scoreDetails[rawId];
    if (!detail) throw new Error('评分数据不存在');
    return detail;
  }

  if (pathOnly === '/api/scores') {
    let results = [...__DATA__.allScores];
    const search = params.get('search');
    if (search) {
      const q = search.toLowerCase();
      results = results.filter(r => (r.company_name || '').toLowerCase().includes(q));
    }
    const grade = params.get('grade');
    if (grade) {
      results = results.filter(r => grade === 'can_gu' ? r.is_cangu : r.grade === grade);
    }
    const sort = params.get('sort') || 'total_score';
    const order = params.get('order') || 'desc';
    const dir = order === 'desc' ? -1 : 1;
    results.sort((a, b) => {
      let va = (sort === 'name' || sort === 'company_name')
        ? (a.company_name || '') : (a[sort] != null ? a[sort] : -999);
      let vb = (sort === 'name' || sort === 'company_name')
        ? (b.company_name || '') : (b[sort] != null ? b[sort] : -999);
      if (typeof va === 'string') va = va.toLowerCase();
      if (typeof vb === 'string') vb = vb.toLowerCase();
      return (va < vb ? -1 : va > vb ? 1 : 0) * dir;
    });
    const gc = {};
    for (const r of results) {
      const g = r.grade || (r.is_cangu ? '参股' : '');
      if (g) gc[g] = (gc[g] || 0) + 1;
    }
    return { total: results.length, grade_counts: gc, data: results };
  }

  if (pathOnly === '/api/overview' || path === '/api/overview')
    return __DATA__.overview;

  throw new Error('Unknown API: ' + path);
}

function showError(msg) {
  var statTotal = document.getElementById('statTotal');
  if (statTotal && (statTotal.textContent === '-' || statTotal.textContent === 'ERROR')) {
    document.getElementById('statTotal').textContent = 'ERROR';
    document.getElementById('statNormal').textContent = 'ERROR';
    document.getElementById('statCapital').textContent = 'ERROR';
    document.getElementById('statCategories').textContent = 'ERROR';
  }
  document.getElementById('tableBody').innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px;color:#e53935;">⚠️ 加载失败：' + msg + '<br><small>请确认数据是否正确导出，或按 F12 查看控制台详细错误</small></td></tr>';
}

          return `<span class="filter-tag revenue-range-tag" data-val="${v}" onclick="toggleRevenueRange(this,'${escV}')">${v}</span>`;

        <span class="clear-group" id="clear_grade" onclick="clearGroup('grade')">清除</span>

      <div class="tags" id="tags_grade">

        ${gradeOptions.map(v => {

          const escV = v.replace(/'/g, "\\'");

          return `<span class="filter-tag" data-key="grade" data-val="${v}" onclick="toggleFilter(this,'grade','${escV}')">${v}</span>`;

        }).join('')}

      </div>

    </div>`;



    // ── 3-6. 投资类别 / 经营状态 / 体系平台 / 地域 ──

    const groups = [

      { key: '类别', label: '投资类别', icon: '📁' },

      { key: '经营状态', label: '经营状态', icon: '🏷️' },

      { key: '独立经营', label: '是否独立经营', icon: '🏢' },

      { key: '体系平台', label: '体系平台', icon: '🔲' },

      { key: '地域', label: '地域', icon: '📍' },

    ];



    for (const g of groups) {

      const vals = data[g.key] || [];

      if (!vals.length) continue;

      const INIT_SHOW = 8;

      const hasMore = vals.length > INIT_SHOW;

      const escKey = g.key.replace(/'/g, "\\'");



      html += `<div class="filter-group" id="group_${g.key}">

        <div class="filter-group-header">

          <span class="title">${g.icon} ${g.label}

            <span class="badge" id="badge_${g.key}" style="display:none;"></span>

          </span>

          <span class="clear-group" id="clear_${g.key}" onclick="clearGroup('${escKey}')">清除</span>

        </div>

        <div class="tags" id="tags_${g.key}">`;



      for (let i = 0; i < vals.length; i++) {

        const v = vals[i];

        const escV = v.replace(/\\/g, '\\\\').replace(/'/g, "\\'");

        const hidden = (hasMore && i >= INIT_SHOW) ? ' style="display:none;"' : '';

        html += `<span class="filter-tag" data-key="${g.key}" data-val="${v}" onclick="toggleFilter(this,'${escKey}','${escV}')"${hidden}>${v}</span>`;

      }



      if (hasMore) {

        html += `<span class="show-more" id="more_${g.key}" onclick="toggleMore('${escKey}')">

          <span id="more_icon_${g.key}">▾</span> 展开更多 (${vals.length - INIT_SHOW})

        </span>`;

      }



      html += `</div></div>`;

    }



    // ── 7-8. 政府投资协议 / 招商承诺（20260701新增）──

    const govGroups = [

      { key: '政府投资协议', label: '政府投资协议', icon: '🏛️', vals: (data['政府投资协议']||[]).filter(v => v !== 'nan') },

      { key: '招商承诺', label: '招商承诺', icon: '📋', vals: (data['招商承诺']||[]).filter(v => v !== 'nan') },

    ];



    for (const g of govGroups) {

      const vals = g.vals;

      if (!vals.length) continue;

      const escKey = g.key.replace(/'/g, "\\'");



      html += `<div class="filter-group" id="group_${g.key}">

        <div class="filter-group-header">

          <span class="title">${g.icon} ${g.label}

            <span class="badge" id="badge_${g.key}" style="display:none;"></span>

          </span>

          <span class="clear-group" id="clear_${g.key}" onclick="clearGroup('${escKey}')">清除</span>

        </div>

        <div class="tags" id="tags_${g.key}">`;



      for (let i = 0; i < vals.length; i++) {

        const v = vals[i];

        const escV = v.replace(/\\/g, '\\\\').replace(/'/g, "\\'");

        html += `<span class="filter-tag" data-key="${g.key}" data-val="${v}" onclick="toggleFilter(this,'${escKey}','${escV}')">${v}</span>`;

      }



      html += `</div></div>`;

    }



    panel.innerHTML = html;

  } catch(e) { console.error('加载筛选器失败:', e); }

}



// ── 展开/收起更多选项 ──

function toggleMore(key) {

  const tags = document.querySelectorAll(`#tags_${key} .filter-tag[style*="none"]`);

  const allTags = document.querySelectorAll(`#tags_${key} .filter-tag`);

  const moreBtn = document.getElementById('more_' + key);

  const moreIcon = document.getElementById('more_icon_' + key);

  const INIT_SHOW = 8;



  if (tags.length > 0) {

    // 展开

    allTags.forEach(t => t.style.display = '');

    moreIcon.textContent = '▴';

    moreBtn.innerHTML = `<span id="more_icon_${key}">▴</span> 收起`;

  } else {

    // 收起（但保留已选中的显示）

    allTags.forEach((t, i) => {

      if (i >= INIT_SHOW && !t.classList.contains('active')) {

        t.style.display = 'none';

      }

    });

    moreIcon.textContent = '▾';

    const hiddenCount = Array.from(allTags).filter((t,i) => i >= INIT_SHOW && !t.classList.contains('active')).length;

    moreBtn.innerHTML = `<span id="more_icon_${key}">▾</span> 展开更多 (${hiddenCount})`;

  }

}



// ── 筛选切换（多选） ──

function toggleFilter(el, key, val) {

  if (!state.filters[key]) state.filters[key] = new Set();

  const s = state.filters[key];



  if (el.classList.contains('active')) {

    el.classList.remove('active');

    s.delete(val);

    if (s.size === 0) delete state.filters[key];

  } else {

    el.classList.add('active');

    s.add(val);

  }



  // 更新徽章和清除按钮

  _updateGroupUI(key);

  state.page = 1;

  loadCompanies();

}



// ── 清除单组 ──

function clearGroup(key) {

  delete state.filters[key];

  document.querySelectorAll(`#tags_${key} .filter-tag.active`).forEach(el => el.classList.remove('active'));

  _updateGroupUI(key);

  state.page = 1;

  loadCompanies();

}



// ── 更新组徽章 ──

function _updateGroupUI(key) {

  const s = state.filters[key];

  const count = s ? s.size : 0;

  const badge = document.getElementById('badge_' + key);

  const clearBtn = document.getElementById('clear_' + key);

  if (badge) {

    badge.textContent = count;

    badge.style.display = count > 0 ? 'inline-flex' : 'none';

  }

  if (clearBtn) {

    clearBtn.classList.toggle('visible', count > 0);

  }

}



// ── 年收入规模筛选 ──

function toggleRevenueRange(el, val) {

  if (el.classList.contains('active')) {

    el.classList.remove('active');

    state.revenueRanges.delete(val);

  } else {

    el.classList.add('active');

    state.revenueRanges.add(val);

  }

  _updateRevenueUI();

  state.page = 1;

  loadCompanies();

}



function onRevenueYearChange(year) {

  state.revenueYear = year;

  if (state.revenueRanges.size > 0) {

    state.page = 1;

    loadCompanies();

  }

}



// ── IP&资质筛选 ──
function toggleIpFilter(el, val) {
  if (state.ipFilters.has(val)) { state.ipFilters.delete(val); el.classList.remove('active'); }
  else { state.ipFilters.add(val); el.classList.add('active'); }
  onIpFilterChange();
}

function onIpFilterChange() {
  var count = state.ipFilters.size;
  var badge = document.getElementById('badge_ip');
  var clearBtn = document.getElementById('clear_ip');
  if (badge) {
    badge.textContent = count;

  }

    clearBtn.classList.toggle('visible', count > 0);
  }

}

function clearIpFilter() {

function clearRevenueFilter() {

let searchTimer;

function doSearch() {

  clearTimeout(searchTimer);

  searchTimer = setTimeout(() => {

    state.search = document.getElementById('searchInput').value.trim();

    state.page = 1;

    loadCompanies();

  }, 300);

}



// ── 排序 ──

function setSort(field) {

  if (state.sort === field) {

    state.order = state.order === 'asc' ? 'desc' : 'asc';

  } else {

    state.sort = field;

    state.order = 'asc';

  }

  loadCompanies();

}



// ── 加载公司列表 ──

async function loadCompanies() {

  try {

    const params = new URLSearchParams();

  if (state.search) params.set('search', state.search);

  for (const k of Object.keys(state.filters)) {

    const valSet = state.filters[k];

    const vals = (valSet instanceof Set) ? Array.from(valSet) : [valSet];

    // 用逗号合并多个值，后端用 split(',') 解析（避免中文键名重复参数的兼容问题）

    if (vals.length > 0) {

      params.set(k, vals.join(','));

    }

  }

  // 年收入规模筛选

  if (state.revenueRanges.size > 0) {

    params.set('revenue_range', Array.from(state.revenueRanges).join(','));

    params.set('revenue_year', state.revenueYear);

  }

  // IP&资质筛选

  if (state.ipFilters.size > 0) {

    params.set('ip_filter', Array.from(state.ipFilters).join(','));

  }

  params.set('page', state.page);

  params.set('limit', state.limit);

  params.set('sort', state.sort);

  params.set('order', state.order);



  const data = await api('/api/companies?' + params.toString());

  document.getElementById('resultCount').textContent = data.total;



  // 表格

  const tbody = document.getElementById('tableBody');

  if (!data.data || !data.data.length) {

    tbody.innerHTML = '<tr><td colspan="12" style="text-align:center;padding:40px;color:#999;">暂无数据</td></tr>';

  } else {

    tbody.innerHTML = data.data.map(row => {

      const statusClass = row['经营状态'] === '经营中' ? 'normal' :

        (row['经营状态'] && row['经营状态'].includes('新设')) ? 'new' :

        (row['经营状态'] && (row['经营状态'].includes('注销') || row['经营状态'].includes('未经营'))) ? 'inactive' : 'other';

      // 评分显示

      const grade = row['grade'] || '';

      const gradeColor = {A:'#2e7d32',B:'#1565c0',C:'#f57f17',D:'#c62828',E:'#e65100',F:'#555'}[grade] || '#888';

      const scoreHtml = row['total_score'] != null

        ? `<span style="font-weight:600;color:${gradeColor};">${row['total_score'].toFixed(1)}</span><small style="color:#aaa;font-size:10px;"> ${grade}</small>`

        : `<small style="color:#ccc;">-</small>`;

      // 阶段显示

      const stageHtml = row['stage'] ? `<span style="font-size:12px;color:#555;">${row['stage']}</span>` : '-';

      // 红牌显示

      const redHtml = row['red_count'] > 0

        ? `<span style="color:#c62828;font-weight:600;font-size:12px;">🚩${row['red_codes']}</span>`

        : '<span style="color:#ccc;font-size:12px;">-</span>';

      // 风险提示标签

      const riskTags = row['_risk_tags'] || [];

      const riskHtml = riskTags.length > 0

        ? riskTags.map(t => `<span style="display:inline-block;background:${t.color}15;color:${t.color};border:1px solid ${t.color}40;border-radius:3px;padding:1px 5px;font-size:10px;margin:1px;font-weight:500;white-space:nowrap;">${t.label}</span>`).join('')

        : '<span style="color:#ccc;font-size:11px;">-</span>';

      return `<tr onclick="openDetail('${row._id}')">

        <td>${row['编码'] || ''}</td>

        <td><strong>${row['公司名称'] || ''}</strong>${row['简称'] ? '<br><small style="color:#999">' + row['简称'] + '</small>' : ''}</td>

        <td>${row['类别'] || ''}</td>

        <td><span class="status-badge ${statusClass}">${row['经营状态'] || ''}</span></td>

        <td style="text-align:center;">${scoreHtml}</td>

        <td style="text-align:center;">${redHtml}</td>

        <td style="max-width:180px;">${riskHtml}</td>

        <td style="text-align:center;">${stageHtml}</td>

        <td>${row['体系平台'] || ''}</td>

        <td>${row['地域'] || ''}</td>

        <td>${row['注册资本_万元'] ? Math.round(row['注册资本_万元']).toLocaleString() : '-'}</td>

        <td style="text-align:center;" onclick="event.stopPropagation()"><input type="checkbox" class="row-checkbox" data-id="${row._id}" onchange="onRowCheckboxChange()"></td>

      </tr>`;

    }).join('');
    _updateSelectedCount();

  }



  // 分页

  const pag = document.getElementById('pagination');

  pag.innerHTML = `

    <button ${state.page <= 1 ? 'disabled' : ''} onclick="goPage(${state.page - 1})">上一页</button>

    <span class="page-info">第 ${state.page} / ${data.pages} 页，共 ${data.total} 条</span>

    <button ${state.page >= data.pages ? 'disabled' : ''} onclick="goPage(${state.page + 1})">下一页</button>

  `;

  } catch(e) { showError(e.message); }

}



function goPage(p) { state.page = p; loadCompanies(); }

  document.querySelectorAll('.row-checkbox:checked').forEach(function(cb){ ids.push(cb.getAttribute('data-id')); });

function _getSelectedCompanies(cb) {
  var ids = _getSelectedIds();
  ovEnsureAllCompanies(function(all){
    var selected = all.filter(function(c){ return ids.indexOf(c._id) >= 0; });
    // 合并公司详情（含财务三表数据）
    var details = (typeof __DATA__ !== 'undefined' && __DATA__.companyDetails) || {};
    selected = selected.map(function(c){
      var detail = details[c._id] || {};
      for (var k in detail) {
        if (detail.hasOwnProperty(k) && (c[k] === undefined || c[k] === null || c[k] === '')) {
          c[k] = detail[k];
        }
      }
      return c;
    });
    cb(selected);
  });
}

    void document.getElementById('printArea').offsetHeight;

    // 使用 beforeprint/afterprint 事件管理 DOM 状态
    function beforePrint() {
      // 隐藏所有非打印区域
      var all = document.body.children;
      for (var i = 0; i < all.length; i++) {
        if (all[i].id !== 'printArea') {
          all[i].setAttribute('data-orig-display', all[i].style.display || '');
          all[i].style.display = 'none';
        }
      }
      var pa = document.getElementById('printArea');
      pa.style.display = 'block';
      pa.style.visibility = 'visible';
      pa.style.position = 'static';
      pa.style.left = 'auto';
      pa.style.top = 'auto';

      pa.style.padding = '20px';
      pa.style.background = '#fff';
      pa.style.color = '#000';

    }
    function afterPrint() {
      var all = document.body.children;
      for (var i = 0; i < all.length; i++) {
        if (all[i].id !== 'printArea') {
          all[i].style.display = all[i].getAttribute('data-orig-display') || '';
          all[i].removeAttribute('data-orig-display');
        }
      }
      document.getElementById('printArea').style.display = 'none';
    }
    window.addEventListener('beforeprint', beforePrint);
    window.addEventListener('afterprint', afterPrint);

    setTimeout(function(){
      window.print();
      setTimeout(function(){
        window.removeEventListener('beforeprint', beforePrint);
        window.removeEventListener('afterprint', afterPrint);
      }, 1500);
    }, 300);
  });
}

async function openDetail(id) {

  document.getElementById('overlay').classList.add('show');

  document.getElementById('detailPanel').classList.add('show');

  document.getElementById('detailBody').innerHTML = '<div class="loading">加载中...</div>';

  document.getElementById('detailTitle').textContent = '公司详情';

  

  const data = await api('/api/companies/' + id);

  state.currentDetail = data;

  document.getElementById('detailTitle').textContent = data['公司名称'] || '公司详情';

  

  // ── 合资方监控 tab 条件显示 ──

  const partnersTab = document.getElementById('detailTabPartners');

  if (partnersTab) {

    const hasPartners = data._partners && data._partners.length > 0;

    const isJV = data['类别'] && data['类别'].indexOf('合资控股') !== -1;

    partnersTab.style.display = (hasPartners || isJV) ? '' : 'none';

  }

  

  // 默认显示评分详情（第一个标签）

  document.querySelectorAll('.detail-tab').forEach(t => t.classList.remove('active'));

  // 合并口径：显示合并口径 Tab 并隐藏基本信息/出资/治理/政府合作/合资方等

  if (data._consolidated) {

    // 显示合并口径 Tab

    var consTab = document.getElementById('detailTabConsolidated');

    if (consTab) consTab.style.display = '';

    // 隐藏不适合合并口径的 Tab

    var hideTabs = ['detailTabBasic', 'detailTabCapital', 'detailTabGovernance', 'detailTabBet', 'detailTabPartners'];

    hideTabs.forEach(function(id) {

      var el = document.getElementById(id);

      if (el) el.style.display = 'none';

    });

    // 选中合并口径 Tab

    if (consTab) {

      consTab.classList.add('active');

      renderConsolidated(data);

      return;

    }

  } else {

    // 非合并口径：恢复被隐藏的Tab，隐藏合并口径Tab

    var restoreTabs = ['detailTabBasic', 'detailTabCapital', 'detailTabGovernance', 'detailTabBet', 'detailTabPartners'];

  document.querySelectorAll('.detail-tab').forEach(t => t.classList.remove('active'));

  const data = state.currentDetail;

  if (!data) return;

function fmt(v) {

  if (v === null || v === undefined || v === '' || v === 'NaN') return '-';

  if (typeof v === 'number') return Math.round(v).toLocaleString();

  const s = String(v).trim();

  if (!s) return '-';

  // 清理时间戳

  if (s.match(/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/)) return s.split(' ')[0];

  return s;

}



// 格式化金额（整数，带千分位）

function fmtMoney(v) {

  if (v === null || v === undefined || v === '' || v === 'NaN') return '-';

  const n = typeof v === 'number' ? v : parseFloat(v);

  if (isNaN(n)) return String(v);

  return Math.round(n).toLocaleString();

}



// 格式化比例（显示为百分比，保留1位小数）

function fmtPct(v) {

  if (v === null || v === undefined || v === '' || v === 'NaN') return '-';

  const n = typeof v === 'number' ? v : parseFloat(v);

  if (isNaN(n)) return String(v);

  // 如果原始值已经是百分数形式（>1），直接格式化；否则 *100

  const pct = Math.abs(n) <= 1 ? n * 100 : n;

  return pct.toFixed(1) + '%';

}



function kv(label, val) {

  return `<div class="kv-row"><div class="key">${label}</div><div class="val">${fmt(val)}</div></div>`;

}

function renderBet(data) {

  // 收集对赌数据（按年份）

  const vamYears = [];

  for (const y of ['2024', '2025', '2026']) {

    const v = data['投资对赌_' + y];

    if (v) vamYears.push({year: y, text: v});

  }

  // 从对赌文本中提取回购条款

  let repoText = data['回购'] || '';

  const vamText = data['投资协议对赌_业绩对赌'] || '';

  if (!repoText && vamText.includes('回购')) {

    repoText = vamText;

  }



  // 收集招商承诺数据

  const commitYears = [];

  for (const y of ['2024', '2025', '2026']) {

    const v = data['招商承诺_' + y];

    if (v) commitYears.push({year: y, text: v});

  }



  // 收集招商销量承诺数据

  const salesCommitYears = [];

  for (const y of ['2024', '2025', '2026']) {

    const v = data['招商销量承诺_' + y];

    if (v) salesCommitYears.push({year: y, text: v});

  }



  // 收集收入预测数据

  const predYears = [];

  for (const y of ['2023', '2024', '2025', '2026', '2027', '2028', '2029']) {

    const v = data[y + '收入预测'];

    if (v !== undefined && v !== '' && v !== null) predYears.push({year: y, val: v});

  }



  let html = '';



  // ── 业绩预警 ──

  const perfAlerts = data['_perf_alerts'] || [];

  const perfYearly = data['_perf_yearly'] || [];



  if (perfAlerts.length > 0) {

    for (const alert of perfAlerts) {

      const isRecovery = alert.level === 'recovery';

      const bg = isRecovery ? '#fff5f5' : '#fff8e1';

      const border = isRecovery ? '#ef5350' : '#f9a825';

      const icon = isRecovery ? '&#128308; ' : '&#128993; ';

      const titleColor = isRecovery ? '#c62828' : '#e65100';

      html += `<div class="section" style="background:${bg};border:2px solid ${border};border-radius:8px;padding:12px;margin-bottom:8px;">

        <h4 style="color:${titleColor};margin:0 0 6px;">${icon}${alert.level_label}：${alert.title}</h4>

        <div style="font-size:13px;color:#555;line-height:1.6;">${alert.message}</div>

      </div>`;

    }

  }



  // ── 年度业绩达成表 ──

  if (perfYearly.length > 0 && perfYearly.some(y => y.has_rev_target || y.has_np_target)) {

    html += `<div class="section"><h4>年度业绩达成情况（万元）</h4>`;

    html += `<table class="data-table" style="font-size:11px;">

      <thead><tr><th>年度</th><th>收入实际</th><th>收入目标</th><th>收入完成率</th><th>净利润实际</th><th>净利润目标</th><th>净利润完成率</th></tr></thead><tbody>`;

    for (const y of perfYearly) {

      const rc = y.revenue_completion;

      let rcStyle = '';

      if (rc != null) {

        if (rc < 30) rcStyle = 'color:#c62828;font-weight:bold;';

        else if (rc < 100) rcStyle = 'color:#e65100;';

        else rcStyle = 'color:#2e7d32;';

      }

      const npc = y.profit_completion;

      let npcStyle = '';

      if (npc != null) {

        if (npc < 30) npcStyle = 'color:#c62828;font-weight:bold;';

        else if (npc < 100) npcStyle = 'color:#e65100;';

        else npcStyle = 'color:#2e7d32;';

      }

      html += `<tr>

        <td>${y.year}</td>

        <td>${fmtMoney(y.revenue_actual)}</td>

        <td>${fmtMoney(y.revenue_target)}</td>

        <td style="${rcStyle}">${rc != null ? rc.toFixed(1) + '%' : '-'}</td>

        <td>${fmtMoney(y.profit_actual)}</td>

        <td>${fmtMoney(y.profit_target)}</td>

        <td style="${npcStyle}">${npc != null ? npc.toFixed(1) + '%' : '-'}</td>

      </tr>`;

    }

    html += `</tbody></table></div>`;

  }



  // ── 政府文件状态 ──

  html += `<div class="section"><h4>政府文件状态</h4>`;

  html += kv('政府投资协议', data['政府投资协议']);

  html += kv('招商承诺', data['招商承诺']);

  html += `</div>`;



  // ── 投资协议对赌 ──

  html += `<div class="section"><h4>投资协议对赌</h4>`;

  if (vamText) {

    html += kv('对赌条款', vamText);

  } else {

    html += kv('对赌条款', data['投资协议对赌_业绩对赌']);

  }

  html += kv('回购条款', repoText || data['回购']);

  // 分年对赌

  if (vamYears.length > 0) {

    html += `<h5 style="font-size:12px;color:#1a237e;margin:12px 0 6px;padding-bottom:4px;border-bottom:1px solid #f0f0f0;">分年对赌</h5>`;

    for (const vy of vamYears) {

      html += kv(vy.year + '年', vy.text);

    }

  }

  html += `</div>`;



  // ── 招商承诺 ──

  html += `<div class="section"><h4>招商承诺</h4>`;

  // 收入承诺 → 分年数据

  if (commitYears.length > 0) {

    html += `<h5 style="font-size:12px;color:#1a237e;margin:12px 0 6px;padding-bottom:4px;border-bottom:1px solid #f0f0f0;">收入承诺（分年）</h5>`;

    for (const cy of commitYears) {

      html += kv(cy.year + '年', typeof cy.text === 'number' ? fmtMoney(cy.text) + ' 万元' : cy.text);

    }

  }

  // 销量承诺 → 分年数据

  if (salesCommitYears.length > 0) {

    html += `<h5 style="font-size:12px;color:#1a237e;margin:12px 0 6px;padding-bottom:4px;border-bottom:1px solid #f0f0f0;">销量承诺（分年）</h5>`;

    for (const sy of salesCommitYears) {

      const n = typeof sy.text === 'number' ? sy.text : parseFloat(sy.text);

      html += kv(sy.year + '年', !isNaN(n) ? fmtMoney(n) : sy.text);

    }

  }

  // 销量承诺汇总（如有）

  const salesAmt = data['招商销量承诺情况'];

  if (salesAmt && !salesCommitYears.some(s => s.year === '2026')) {

    html += kv('销量承诺汇总', typeof salesAmt === 'number' ? fmtMoney(salesAmt) : salesAmt);

  }

  // 无承诺数据时提示

  if (commitYears.length === 0 && salesCommitYears.length === 0) {

    html += `<div style="color:#999;padding:8px;">暂无招商承诺数据</div>`;

  }

  html += `</div>`;



  // ── 政府协议违约责任 ──

  const govDefault = data['政府协议违约责任'] || '';

  if (govDefault && govDefault !== 'N/A' && govDefault !== '-') {

    html += `<div class="section" style="background:#fff8e1;border:1px solid #ffe082;border-radius:8px;padding:14px;">

      <h4 style="color:#e65100;margin:0 0 8px;">⚠️ 政府协议违约责任</h4>

      <div style="font-size:13px;color:#555;line-height:1.8;white-space:pre-wrap;">${govDefault}</div>

    </div>`;

  }



  // ── 未来收入利润规划 ──

  html += `<div class="section"><h4>未来收入利润规划</h4>`;

  if (predYears.length > 0) {

    html += `<table class="data-table">

      <thead><tr><th>年度</th><th>收入预测(万元)</th><th>净利润预测(万元)</th></tr></thead><tbody>`;

    for (const py of predYears) {

      const np = data[py.year + '净利润预测'];

      html += `<tr><td>${py.year}</td><td>${fmtMoney(py.val)}</td><td>${fmtMoney(np)}</td></tr>`;

    }

    html += `</tbody></table>`;

  } else {

    html += kv('未来收入利润规划', data['未来收入利润规划_from设立可研__汇总']);

  }

  html += `</div>`;



  // ── 承诺执行情况 ──

  html += `<div class="section"><h4>承诺执行情况</h4>

    ${kv('2023', data['2023承诺执行情况'])}

    ${kv('2024', data['2024承诺执行情况'])}

    ${kv('2025', data['2025承诺执行情况'])}

    ${kv('2026', data['2026承诺执行情况'])}

  </div>`;



  // ── 政府协议违约责任（承诺未完成时提示）──

  const _govDefault = data['政府协议违约责任'] || '';

  if (_govDefault && _govDefault !== 'N/A' && _govDefault !== '-') {

    // 检查是否有承诺未完成

    const _perfAlerts = data['_perf_alerts'] || [];

    const hasUnfinished = _perfAlerts.some(a => a.level !== 'recovery');

    const commitVals = [data['2023承诺执行情况'], data['2024承诺执行情况'], data['2025承诺执行情况'], data['2026承诺执行情况']];

    const hasCommitIssue = commitVals.some(v => v && (v.includes('未') || v.includes('不满') || v.includes('差异')));

    if (hasUnfinished || hasCommitIssue) {

      html += `<div class="section" style="background:#ffebee;border:2px solid #ef5350;border-radius:8px;padding:14px;">

        <h4 style="color:#c62828;margin:0 0 8px;">⚡ 承诺未完成 → 违约责任提示</h4>

        <div style="font-size:13px;color:#555;line-height:1.8;white-space:pre-wrap;">${_govDefault}</div>

      </div>`;

    } else if (_govDefault) {

      // 无未完成承诺，但也展示违约责任（折叠式）

      html += `<details class="section" style="background:#f5f5f5;border:1px solid #e0e0e0;border-radius:8px;padding:10px 14px;">

        <summary style="cursor:pointer;font-size:13px;color:#888;">⚖️ 政府协议违约责任（点击展开）</summary>

        <div style="font-size:13px;color:#555;line-height:1.8;white-space:pre-wrap;margin-top:8px;">${_govDefault}</div>

      </details>`;

    }

  }



  // ── 风险提示（相关） ──

  const riskText = data['风险及建议'] || '';

  if (riskText && (riskText.includes('对赌') || riskText.includes('承诺') || riskText.includes('回购'))) {

    html += `<div class="section" style="background:#fff8e1;border:1px solid #ffe082;border-radius:8px;padding:12px;">

      <h4 style="color:#e65100;">⚠️ 风险提示（对赌/承诺相关）</h4>

      <div style="font-size:13px;color:#555;line-height:1.6;">${riskText}</div>

    </div>`;

  }



  document.getElementById('detailBody').innerHTML = html;

}



// ════════════════════════════════════════

//  合资方监控（公司详情标签）

// ════════════════════════════════════════

function renderDetailPartners(data) {

  const partners = data['_partners'] || [];

  const isUnsynced = data['_capital_unsynced'];

  const unsyncReason = data['_capital_unsync_reason'] || '';

  const otherPaid = data['_other_paid_capital'] || '';

  const otherSub = data['_other_sub_capital'] || '';

  const capitalNote = data['_capital_note'] || '';



  if (!partners || partners.length === 0) {

    document.getElementById('detailBody').innerHTML =

      '<div class="section" style="padding:40px;text-align:center;color:#999;">该公司无外部合资方数据（可能为全资子公司或数据未录入）</div>';

    return;

  }



  // 风险等级颜色映射

  var riskColors = {high:'#e53935', medium:'#fb8c00', low:'#43a047', not_found:'#9e9e9e', na:'#bbb', unknown:'#9e9e9e'};

  var riskLabels = {high:'⚠️ 高风险', medium:'📋 关注', low:'✅ 正常', not_found:'🌐 境外/未收录', na:'👤 自然人', unknown:'⏳ 待查询'};



  // ── 第1部分：合资方基本信息 ──

  var html = '<div class="section"><h4>📋 合资方基本信息</h4>';

  html += '<table class="data-table" style="width:100%;"><thead><tr>' +

    '<th>合资方名称</th><th>类型</th><th>持股比例</th><th>企查查状态</th><th>风险等级</th>' +

    '</tr></thead><tbody>';

  for (var i = 0; i < partners.length; i++) {

    var p = partners[i];

    var riskLvl = p.qcc_risk_level || 'unknown';

    var riskLabel = riskLabels[riskLvl] || '⏳ 待查询';

    var statusLabel = p.qcc_status === 'checked' ? '✅ 已查询' :

                       p.qcc_status === 'not_found' ? '🌐 未收录' :

                       p.qcc_status === 'na' ? '👤 自然人' : '⏳ 待查询';

    html += '<tr>' +

      '<td style="font-weight:500;">' + p.name + '</td>' +

      '<td>' + (p.type||'') + '</td>' +

      '<td style="text-align:right;">' + (p.ratio||0) + '%</td>' +

      '<td>' + statusLabel + '</td>' +

      '<td><span style="color:' + (riskColors[riskLvl]||'#999') + ';font-weight:600;font-size:12px;">' + riskLabel + '</span></td>' +

      '</tr>';

  }

  html += '</tbody></table></div>';



  // ── 第2部分：企查查风险预警 ──

  var hasRisks = false;

  var riskHtml = '';

  for (var i = 0; i < partners.length; i++) {

    var p = partners[i];

    if (p.type !== '公司') continue;

    var lvl = p.qcc_risk_level || 'unknown';

    if (lvl === 'high' || lvl === 'medium') {

      hasRisks = true;

      var bgColor = lvl === 'high' ? '#ffebee' : '#fff8e1';

      var borderColor = lvl === 'high' ? '#e53935' : '#fb8c00';

      var risks = (p.qcc_risks||[]).join('、');

      riskHtml += '<div style="padding:10px 12px;margin-bottom:6px;background:' + bgColor +

        ';border-left:3px solid ' + borderColor + ';border-radius:4px;">' +

        '<div style="font-weight:600;font-size:13px;">' + p.name +

        ' <span style="color:'+borderColor+';font-size:12px;">' + riskLabels[lvl] + '</span></div>' +

        '<div style="font-size:12px;color:#666;margin-top:4px;">' + (p.qcc_summary||'') + '</div>' +

        (risks ? '<div style="font-size:11px;color:#999;margin-top:4px;">🏷 ' + risks + '</div>' : '') +

        '<div style="font-size:11px;color:#aaa;margin-top:3px;">📅 最近变更：' + (p.qcc_last_change||'无') +

        ' ｜ 累计变更：' + (p.qcc_total_changes||0) + '次</div>' +

        '</div>';

    }

  }

  html += '<div class="section"><h4>🔔 企查查风险预警</h4>';

  if (hasRisks) {

    html += riskHtml;

  } else {

    html += '<div style="padding:20px;text-align:center;color:#999;">✅ 所有合资方暂无风险预警</div>';

  }

  html += '</div>';



  // ── 第3部分：实缴出资同步情况 + 风险提示 ──

  html += '<div class="section"><h4>💰 实缴出资同步情况</h4>';



  // 根据实缴说明判断风险等级

  var _cn = (capitalNote||'').trim();

  var capRisk = 'safe';   // safe / partial / high / na

  if (_cn === 'N/A' || _cn === '') {

    capRisk = 'na';

  } else if (_cn.indexOf('未同步实缴') >= 0 || _cn.indexOf('未全部实缴') >= 0 || _cn.indexOf('已逾期') >= 0) {

    capRisk = 'high';

  } else if (_cn.indexOf('全额实缴') >= 0 || _cn.indexOf('全部实缴') >= 0 || _cn.indexOf('同比例全额实缴') >= 0) {

    capRisk = 'safe';

  } else if (_cn.indexOf('部分实缴') >= 0) {

    capRisk = 'partial';

  } else {

    capRisk = 'high';

  }



  // 风险等级卡片

  var capBg = {'safe':'#e8f5e9','partial':'#fff8e1','high':'#ffebee','na':'#f5f5f5'};

  var capBorder = {'safe':'#81c784','partial':'#f9a825','high':'#ef5350','na':'#e0e0e0'};

  var capColor = {'safe':'#2e7d32','partial':'#e65100','high':'#c62828','na':'#9e9e9e'};

  var capIcon = {'safe':'✅','partial':'⚠️','high':'❌','na':'—'};

  var capLabel = {'safe':'实缴出资已完成，无风险','partial':'部分实缴，需关注','high':'存在未实缴/未同步风险，需及时处理','na':'不适用'};



  html += '<div style="background:' + capBg[capRisk] + ';border:1px solid ' + capBorder[capRisk] + ';border-radius:8px;padding:14px;margin-bottom:10px;">' +

    '<div style="font-weight:600;font-size:14px;color:' + capColor[capRisk] + ';">' + capIcon[capRisk] + ' ' + capLabel[capRisk] + '</div>';



  // 高风险时解析详细信息

  if (capRisk === 'high' && _cn) {

    var isOverdue = _cn.indexOf('已逾期') >= 0;

    var amountMatch = _cn.match(/涉及金额[\s]*(\d+\.?\d*)[\s]*万/);

    var amount = amountMatch ? amountMatch[1] + '万元' : '';



    if (isOverdue) {

      html += '<div style="background:#fff;border:1px solid #ef5350;border-radius:6px;padding:10px;margin-top:8px;">' +

        '<div style="color:#c62828;font-weight:600;font-size:13px;">⚠️ 出资承诺已逾期，请及时催缴！</div>' +

        '</div>';

    }

    if (amount) {

      html += '<div style="font-size:12px;color:#666;margin-top:8px;">涉及风险金额：<span style="color:#c62828;font-weight:700;">' + amount + '</span></div>';

    }



    // 高亮关键词

    var highlighted = _cn

      .replace(/(已逾期)/g, '<span style="color:#c62828;font-weight:700;background:#ffebee;padding:1px 4px;border-radius:3px;">$1</span>')

      .replace(/(涉及金额[\s]*\d+\.?\d*[\s]*万)/g, '<span style="color:#c62828;font-weight:700;">$1</span>')

      .replace(/(202\d\.\d+\.\d+[前日])/g, '<span style="color:#1565c0;font-weight:600;">$1</span>')

      .replace(/(催缴|出资缴付通知书|承诺函)/g, '<span style="color:#e65100;">$1</span>');

    html += '<div style="font-size:12px;color:#444;line-height:1.8;margin-top:8px;padding:8px;background:#fff;border-radius:6px;">' + highlighted + '</div>';

  } else if (capRisk === 'partial' && _cn) {

    html += '<div style="font-size:12px;color:#444;line-height:1.8;margin-top:8px;padding:8px;background:#fff;border-radius:6px;">' + _cn + '</div>';

  }



  html += '</div>';



  // 详细表格

  html += '<table class="data-table" style="width:100%;margin-top:8px;"><tbody>' +

    '<tr><td style="width:140px;color:#888;">其他股东认缴出资</td><td>' + (otherSub||'-') + '</td></tr>' +

    '<tr><td style="color:#888;">其他股东实缴出资</td><td>' + (otherPaid||'-') + '</td></tr>';

  if (_cn && _cn !== 'N/A') {

    html += '<tr><td style="color:#888;">实缴说明</td><td>' + _cn + '</td></tr>';

  }

  html += '</tbody></table></div>';



  document.getElementById('detailBody').innerHTML = html;

}

// ══════════════════════════════════════

//  合并口径详情面板

// ══════════════════════════════════════

function renderConsolidated(data) {

  var body = document.getElementById('detailBody');

  var snap = data._financial_snapshot;

  var companies = data._involved_companies || [];

  

  var html = '';

  

  // ── 涉及公司 ──

  html += '<div class="section"><h4>📋 涉及公司</h4><div class="section-content">';

  html += '<ul style="list-style:none;padding:0;margin:0;">';

  companies.forEach(function(c) {

    html += '<li style="padding:6px 12px;margin:4px 0;background:#f5f5f5;border-radius:6px;font-size:13px;">' + c + '</li>';

  });

  html += '</ul></div></div>';

  

  // ── 财务报表 ──

  if (snap && snap.years && snap.years.length > 0) {

    var years = snap.years;

    

    // Balance Sheet

    html += '<div class="section"><h4>📊 资产负债表（万元）</h4><div class="section-content">';

    html += '<div style="overflow-x:auto;"><table class="score-table" style="min-width:600px;"><thead><tr><th>项目</th>';

    years.forEach(function(y) { html += '<th style="text-align:right">' + y + '年</th>'; });

    html += '</tr></thead><tbody>';

    (snap.balance || []).forEach(function(row) {

      html += '<tr><td>' + row.item + '</td>';

      years.forEach(function(y) {

        var v = row.values[y];

        html += '<td style="text-align:right">' + (v != null ? v.toLocaleString('zh-CN', {maximumFractionDigits:1}) : '-') + '</td>';

      });

      html += '</tr>';

    });

    html += '</tbody></table></div></div></div>';

    

    // Income Statement

    if (snap.income && snap.income.length > 0) {

      html += '<div class="section"><h4>💰 利润表（万元）</h4><div class="section-content">';

      html += '<div style="overflow-x:auto;"><table class="score-table" style="min-width:400px;"><thead><tr><th>项目</th>';

      years.forEach(function(y) { html += '<th style="text-align:right">' + y + '年</th>'; });

      html += '</tr></thead><tbody>';

      (snap.income || []).forEach(function(row) {

        html += '<tr><td>' + row.item + '</td>';

        years.forEach(function(y) {

          var v = row.values[y];

          html += '<td style="text-align:right">' + (v != null ? v.toLocaleString('zh-CN', {maximumFractionDigits:1}) : '-') + '</td>';

        });

        html += '</tr>';

      });

      html += '</tbody></table></div></div></div>';

    }

    

    // Cash Flow

    if (snap.cashflow && snap.cashflow.length > 0) {

      html += '<div class="section"><h4>💵 现金流量（万元）</h4><div class="section-content">';

      html += '<div style="overflow-x:auto;"><table class="score-table" style="min-width:400px;"><thead><tr><th>项目</th>';

      years.forEach(function(y) { html += '<th style="text-align:right">' + y + '年</th>'; });

      html += '</tr></thead><tbody>';

      (snap.cashflow || []).forEach(function(row) {

        html += '<tr><td>' + row.item + '</td>';

        years.forEach(function(y) {

          var v = row.values[y];

          html += '<td style="text-align:right">' + (v != null ? v.toLocaleString('zh-CN', {maximumFractionDigits:1}) : '-') + '</td>';

        });

        html += '</tr>';

      });

      html += '</tbody></table></div></div></div>';

    }

  }

  

  body.innerHTML = html;

}

let _detailScoreChart = null;



async function renderDetailScore(companyData) {

  const detailBody = document.getElementById('detailBody');

  detailBody.innerHTML = '<div class="loading">加载评分详情...</div>';



  const data = await api('/api/scores/' + companyData['_id']);



  let html = '';



  // 红牌警告

  if (data.red_cards && data.red_cards.length > 0) {

    html += `<div class="section" style="background:#fff0f0;border:1px solid #ffcdd2;border-radius:8px;padding:12px;margin-bottom:16px;">

      <h4 style="color:#c62828;">🔴 红牌触发</h4>`;

    for (const rc of data.red_cards) {

      html += `<div style="font-size:13px;color:#c62828;padding:2px 0;">${rc.code}: ${rc.desc}</div>`;

    }

    html += `</div>`;

  }



  // 雷达图数据

  const dims = [

    { label: '财务健康\n(50分)', keys: ['F1','F2','F3','F4','F5','F7','F8'], maxWeight: 50 },

    { label: '合同执行\n(25分)', keys: ['C1','C2','C3','C4','C5','C6'], maxWeight: 25 },

    { label: '经营质量\n(15分)', keys: ['O1','O3','O5'], maxWeight: 15 },

    { label: '合规风控\n(10分)', keys: ['G1','G2','G3','G4'], maxWeight: 10 },

  ];

  const radarLabels = [];

  const radarValues = [];



  // 基本信息 + 雷达图（双栏）

  html += `<div class="score-overview">

    <div class="info-col"><div class="section" style="margin-bottom:0;"><h4>基本信息</h4>

      ${kv('公司名称', data.company_name)}

      ${kv('行业', data.industry || '-')}

      ${kv('经营状态', data.business_status || '-')}

      ${kv('是否独立经营', data.stage_label)}

      ${kv('等级', '<span class="grade-badge ' + (data.grade ? 'grade-' + data.grade : '') + '">' + data.grade_label + '</span>')}

      ${kv('总分', data.total_score != null ? data.total_score.toFixed(1) + ' / 100' : '-')}

      ${kv('数据覆盖率', data.data_coverage + '%')}

      ${kv('处置建议', data.recommendation)}

    </div></div>

    <div class="radar-col"><canvas id="radarChartDetail"></canvas></div>

  </div>`;



  // 分维度详情

  if (data.scores && Object.keys(data.scores).length > 0) {

    for (const dim of dims) {

      // 动态计算该维度实际满分（基于当前公司的 max_score，孵化期公司 F2/F3 max=0）

      const actualDimMax = dim.keys.reduce((sum, k) => {

        const s = data.scores[k];

        return sum + (s && s.max_score > 0 ? s.max_score : 0);

      }, 0);

      const dimLabel = dim.label.replace(/\(\d+分\)/, `(${actualDimMax}分)`);

      const dimName = dimLabel.replace('\n', ' ');

      html += `<div class="section"><h4>${dimName}</h4>

        <table class="data-table">

        <thead><tr><th style="width:40px;">编号</th><th style="width:90px;">指标名称</th><th style="width:48px;">得分</th><th style="width:42px;">满分</th><th style="width:45px;">状态</th><th style="width:62px;">数据来源</th><th style="min-width:240px;">计算公式 / 计算过程</th></tr></thead><tbody>`;

      let dimScored = 0, dimMax = 0;

      for (const k of dim.keys) {

        const s = data.scores[k];

        if (!s) continue;

        const meta = INDICATOR_META[k] || { name: k, formula: '-' };

        const icon = s.available ? '✓' : '✗';

        const color = s.available ? '#2e7d32' : '#999';

        const source = s.source || '数据缺失';

        const sourceColor = source === '主Excel' ? '#2e7d32' : source === '补充数据' ? '#e65100' : '#999';

        const sourceBg = source === '主Excel' ? '#e8f5e9' : source === '补充数据' ? '#fff3e0' : '#f5f5f5';

        html += `<tr>

          <td style="font-weight:600;">${k}</td>

          <td style="text-align:left;font-size:12px;">${meta.name}</td>

          <td style="color:${color};font-weight:600;">${s.available ? s.score.toFixed(1) : '-'}</td>

          <td>${s.max_score}</td>

          <td style="font-size:11px;color:${color};">${s.available ? icon : '缺失'}</td>

          <td><span style="display:inline-block;padding:1px 6px;border-radius:8px;font-size:10px;font-weight:600;color:${sourceColor};background:${sourceBg};">${source}</span></td>

          <td style="text-align:left;line-height:1.6;">

            <div style="font-size:10px;color:#888;margin-bottom:3px;border-bottom:1px dashed #e0e0e0;padding-bottom:3px;">${meta.formula}</div>

            <div style="font-size:11px;color:${s.available ? '#1a237e' : '#999'};">${s.detail || '（无数据）'}</div>

          </td>

        </tr>`;

        // 满分总是累加（包含数据缺失项），得分只累加有数据的

        if (s.max_score > 0) { dimMax += s.max_score; }

        if (s.available) { dimScored += Math.min(s.score, s.max_score); }

      }

      const dimTotal = dimMax > 0 ? Math.round(dimScored / dimMax * 100) : 0;

      html += `<tr style="font-weight:600;background:#fafafa;">

        <td colspan="3">维度合计</td>

        <td>${dimScored.toFixed(1)}</td><td>${dimMax}</td>

        <td style="color:#1a237e;">${dimTotal}%</td>

        <td></td>

        <td>得分率 = ${dimScored.toFixed(1)} ÷ ${dimMax} × 100</td>

      </tr>`;

      html += `</tbody></table></div>`;



      radarLabels.push(dim.label.replace('\n', ''));

      radarValues.push(dimTotal);

    }

  }



  detailBody.innerHTML = html;



  // 绘制雷达图

  setTimeout(() => {

    const canvas = document.getElementById('radarChartDetail');

    if (!canvas) return;

    if (_detailScoreChart) { _detailScoreChart.destroy(); _detailScoreChart = null; }

    if (typeof Chart === 'undefined') return;

    _detailScoreChart = new Chart(canvas, {

      type: 'radar',

      data: {

        labels: radarLabels,

        datasets: [{

          label: '各维度得分率 (%)',

          data: radarValues,

          backgroundColor: 'rgba(26, 35, 126, 0.15)',

          borderColor: '#1a237e',

          borderWidth: 2,

          pointBackgroundColor: '#1a237e',

          pointBorderColor: '#fff',

          pointBorderWidth: 2,

          pointRadius: 4,

        }]

      },

      options: {

        responsive: true,

        maintainAspectRatio: true,

        plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => `得分率: ${ctx.raw}%` } } },

        scales: {

          r: {

            beginAtZero: true, max: 100, min: 0,

            ticks: { stepSize: 20, font: { size: 10 }, backdropColor: 'transparent' },

            pointLabels: { font: { size: 11, weight: 'bold' }, color: '#333' },

            grid: { color: 'rgba(0,0,0,0.08)' },

            angleLines: { color: 'rgba(0,0,0,0.08)' },

          }

        }

      }

    });

  }, 100);

}

function ovDrilldown(chartTitle, filterFn) {
  // 获取公司数据
  var allComps = [];
  if (typeof __DATA__ !== 'undefined' && __DATA__.allCompanies) {
    allComps = __DATA__.allCompanies;
  } else if (__DATA__ && __DATA__.companies) {
    allComps = __DATA__.companies;
  } else if (window._ovAllCompanies) {
    allComps = window._ovAllCompanies;
  }

  var filtered = allComps.filter(filterFn);

  var gradeClass = {A:'grade-A',B:'grade-B',C:'grade-C',D:'grade-D',E:'grade-E',F:'grade-F','参股':'grade-参股'};
  var rows = filtered.map(function(c) {
    var g = c.grade || '';
    var badge = g ? '<span class="grade-badge ' + (gradeClass[g]||'grade-F') + '">' + g + '</span>' : '<span style="color:#bbb">-</span>';
    var status = c['经营状态'] || '';
    var statusColor = status === '经营中' ? '#43a047' : (status === '注销' ? '#e53935' : '#fb8c00');
    var cid = c._id || '';
    return '<tr>' +
      '<td style="padding:8px 10px;border-bottom:1px solid #f0f0f0;"><a href="javascript:void(0)" onclick="ovOpenCompanyDetail(\'' + cid + '\')" style="color:#1a237e;text-decoration:none;font-weight:500;" onmouseover="this.style.textDecoration=\'underline\'" onmouseout="this.style.textDecoration=\'none\'">' + (c['公司名称']||'') + '</a></td>' +
      '<td style="padding:8px 10px;border-bottom:1px solid #f0f0f0;color:#666;font-size:12px;">' + (c['类别']||'') + '</td>' +
      '<td style="padding:8px 10px;border-bottom:1px solid #f0f0f0;text-align:center;">' + badge + '</td>' +
      '<td style="padding:8px 10px;border-bottom:1px solid #f0f0f0;text-align:center;color:' + statusColor + ';font-size:12px;">' + status + '</td>' +
      '<td style="padding:8px 10px;border-bottom:1px solid #f0f0f0;text-align:center;color:#666;font-size:12px;">' + (c['体系平台']||'-') + '</td>' +
      '</tr>';
  }).join('');

  var modal = document.createElement('div');
  modal.id = 'ovDrillModal';
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;display:flex;align-items:center;justify-content:center;';
  modal.innerHTML = '<div style="background:#fff;border-radius:12px;width:min(780px,95vw);max-height:80vh;display:flex;flex-direction:column;box-shadow:0 8px 40px rgba(0,0,0,.25);">' +
    '<div style="display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid #e0e0e0;background:#1a237e;border-radius:12px 12px 0 0;">' +
      '<span style="color:#fff;font-weight:600;font-size:15px;">📋 ' + chartTitle + '（共 ' + filtered.length + ' 家）</span>' +
      '<button onclick="document.getElementById(\'ovDrillModal\').remove()" style="background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:6px;padding:4px 14px;cursor:pointer;font-size:13px;">✕ 关闭</button>' +
    '</div>' +
    '<div style="overflow-y:auto;padding:0;">' +
      '<table style="width:100%;border-collapse:collapse;font-size:13px;">' +
        '<thead><tr style="background:#f5f7fa;position:sticky;top:0;">' +
          '<th style="padding:10px;text-align:left;border-bottom:2px solid #e0e0e0;">公司名称</th>' +
          '<th style="padding:10px;text-align:left;border-bottom:2px solid #e0e0e0;">类别</th>' +
          '<th style="padding:10px;text-align:center;border-bottom:2px solid #e0e0e0;">评级</th>' +
          '<th style="padding:10px;text-align:center;border-bottom:2px solid #e0e0e0;">经营状态</th>' +
          '<th style="padding:10px;text-align:center;border-bottom:2px solid #e0e0e0;">体系平台</th>' +

      '</table>' +
    '</div>' +

  // 点遮罩关闭
  modal.addEventListener('click', function(e){ if(e.target===modal) modal.remove(); });
  document.body.appendChild(modal);

// 从总览弹窗中打开公司详情（自动处理视图切换）
function ovOpenCompanyDetail(id) {
  // 1. 隐藏弹窗（保留以便返回）
  var modal = document.getElementById('ovDrillModal');
  if (modal) { modal.style.display = 'none'; window._lastDrillModal = modal; window._detailFromDrilldown = true; }
  var modal2 = document.getElementById('ovIpDrillModal');
  if (modal2) { modal2.style.display = 'none'; window._lastDrillModal = modal2; window._detailFromDrilldown = true; }

  // 2. 如果当前在总览视图，先切回投资看板（overlay/detailPanel 在总览下不在 DOM 中）
  if (state.overviewVisible) {
    toggleOverview(); // 切换回 portfolio，恢复 overlay/detailPanel
    // 等 DOM 恢复后再打开详情
    setTimeout(function() { openDetail(id); setTimeout(function(){ document.getElementById('detailBackLink').style.display = 'inline'; }, 350); }, 300);
  } else {
    openDetail(id);
    setTimeout(function(){ document.getElementById('detailBackLink').style.display = 'inline'; }, 50);
  }
}

function ovOpenIpCompanyDetail(id) {
  // 隐藏IP钻取弹窗（保留以便返回）
  var modal = document.getElementById('ovIpDrillModal');
  if (modal) { modal.style.display = 'none'; window._lastDrillModal = modal; window._detailFromDrilldown = true; }

    toggleOverview();

  } else {
    openDetail(id);
  }
}

// 从公司详情返回总览清单位置
function ovReturnToDrillList() {
  closeDetail();
  if (!state.overviewVisible) { toggleOverview(); }
  window._detailFromDrilldown = false;
  setTimeout(function() {
    if (window._lastDrillModal) {
      window._lastDrillModal.style.display = 'flex';
    }
  }, 400);
}

// 预加载全量公司（独立版用 allCompanies，Flask 版从 API 拉取）
function ovEnsureAllCompanies(cb) {
  // 独立版：__DATA__.allCompanies（const 不会挂到 window，直接引用变量）
  if (typeof __DATA__ !== 'undefined' && __DATA__.allCompanies) { cb(__DATA__.allCompanies); return; }
  // 兼容旧字段名
  if (typeof __DATA__ !== 'undefined' && __DATA__.companies) { cb(__DATA__.companies); return; }
  if (window._ovAllCompanies) { cb(window._ovAllCompanies); return; }
  // Flask 版：从 /api/companies 拉取全量
  fetch('/api/companies?limit=500').then(r=>r.json()).then(function(d){
    window._ovAllCompanies = d.data || [];
    cb(window._ovAllCompanies);
  }).catch(function(){ cb([]); });
}

// 通用图表点击处理
function ovChartClick(chartTitle, labelMapper, filterBuilder) {
  return function(evt, elements) {
    if (!elements || !elements.length) return;
    var idx = elements[0].index;

    ovEnsureAllCompanies(function(comps) {
      ovDrilldown(title, filterBuilder(rawLabel, label));

  };
}

function ovRenderRisk(d) {

  const values = labels.map(k => data[k]);

    '仅经营异常': '#ff9800',
    '仅收回投资': '#e53935',
    '仅红牌警示': '#9c27b0',
    '经营异常+红牌': '#ff7043',
    '收回投资+红牌': '#d32f2f',
    '经营异常+收回投资': '#f44336',
    '三项全有': '#b71c1c',
  };
  const bgColors = labels.map(k => colors[k] || '#999');
  const rawKeys = labels.slice();

  const ctx = document.getElementById('ovChartRisk').getContext('2d');
  const chart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: labels,
      datasets: [{
        data: values,
        backgroundColor: bgColors,
        borderColor: '#fff',
        borderWidth: 2,
      }]
    },

      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          position: 'right',
          labels: { boxWidth: 12, padding: 10, font: { size: 11 } }
        },
        tooltip: {
          callbacks: {
            label: function(ctx) {
              const total = ctx.dataset.data.reduce((a,b)=>a+b,0);
              const pct = total > 0 ? (ctx.raw / total * 100).toFixed(1) : 0;
              return ctx.label + ': ' + ctx.raw + '家 (' + pct + '%)';
            }
          }
        }

      onClick: function(e, els) {

        const label = this.data.labels[els[0].index];

          ovDrilldownByRisk(label, comps);
        });
      }
    }
  });
  _ovCharts.push(chart);

  // Store rawKeys for drilldown
  chart._rawKeys = rawKeys;
}

function ovDrilldownByRisk(label, comps) {
  // Build logic for each risk category
  const hasAbnormal = function(c) {
    return (c._risk_tags || []).some(function(t) { return t.type === 'perf_abnormal'; });
  };
  const hasRecovery = function(c) {
    return (c._risk_tags || []).some(function(t) { return t.type === 'recovery'; });
  };
  const hasRed = function(c) {
    return (c.red_count || 0) > 0;
  };

  var filter;
  if (label === '无风险') {
    filter = function(c) { return !hasAbnormal(c) && !hasRecovery(c) && !hasRed(c); };
  } else if (label === '仅经营异常') {
    filter = function(c) { return hasAbnormal(c) && !hasRecovery(c) && !hasRed(c); };
  } else if (label === '仅收回投资') {
    filter = function(c) { return !hasAbnormal(c) && hasRecovery(c) && !hasRed(c); };
  } else if (label === '仅红牌警示') {
    filter = function(c) { return !hasAbnormal(c) && !hasRecovery(c) && hasRed(c); };
  } else if (label === '经营异常+红牌') {
    filter = function(c) { return hasAbnormal(c) && !hasRecovery(c) && hasRed(c); };
  } else if (label === '收回投资+红牌') {
    filter = function(c) { return !hasAbnormal(c) && hasRecovery(c) && hasRed(c); };

      return hasG && !hasB && !hasS && hasC;

    filter = function(c) {
      var g = (c['政府投资协议'] || '').toString().trim();
      var hasG = g && !['N/A','-','无','nan','否',''].includes(g);
      var breach = (c['政府协议违约责任'] || '').toString().trim();
      var hasB = breach && !['N/A','-','nan',''].includes(breach);
      var subsidy = c['政府补贴_2026'];
      var site = c['场地总费用'];
      var hasS = false;
      if (subsidy != null) { try { hasS = parseFloat(subsidy) > 0; } catch(e){} }
      if (!hasS && site != null) { try { hasS = parseFloat(site) > 0; } catch(e){} }

  (d.top_revenue||[]).forEach((c,i) => {
    const rk = i<3 ? 'rank-'+(i+1) : 'rank-other';
    rows += `<tr style="border-bottom:1px solid #f0f0f0;"><td style="padding:6px;text-align:center;"><span class="rank-badge ${rk}">${i+1}</span></td><td style="padding:6px;">${c.name}</td><td style="padding:6px;text-align:right;font-weight:500;">${(c.revenue||0).toLocaleString('zh-CN',{maximumFractionDigits:0})}</td><td style="padding:6px;font-size:11px;color:#666;">${c.category||''}</td></tr>`;
  });
  var revTb = document.getElementById('ovRevenueTop');
  if (revTb) revTb.innerHTML = rows || '<tr><td colspan="4" style="padding:20px;text-align:center;color:#999;">暂无数据</td></tr>';
}



function renderIpCharts(ipData) {
    if (!ipData || !document.getElementById('ipBarChart')) return;
    if (typeof Chart === 'undefined') return;
    
    // 颜色与总览其他图保持一致：青/蓝/紫/绿
    var palette = ['#5B8FF9', '#5AD8A6', '#F6BD16', '#E86452'];
    var paletteDoughnut = ['#e0e0e0', '#F6BD16', '#FF9D4D', '#5AD8A6', '#5B8FF9'];
    
    var barCtx = document.getElementById('ipBarChart');
    new Chart(barCtx, {
      type: 'bar',
      data: {
        labels: ['专利', '软著', '荣誉资质', '资质证书'],
        datasets: [{
          label: '拥有该IP的公司数',
          data: [ipData.hasPatent, ipData.hasSoftware, ipData.hasHonor, ipData.hasCertificate],
          backgroundColor: palette,
          borderRadius: 4,
        }]
      },
      options: {
        indexAxis: 'y',
        responsive: false,
        plugins: { 
          legend: { display: false },
          tooltip: { callbacks: { 
            label: function(ctx) { 
              return '拥有该类的公司数：' + ctx.raw;
            }
          }}
        },
        scales: { 
          x: { beginAtZero: true, ticks: { stepSize: 5 }, title: { display: true, text: '公司数量' } } 
        },
        onClick: function(evt, items) {
          if (items.length > 0) {
            var idx = items[0].index;
            var types = ['patent', 'soft', 'honor', 'cert'];
            ovShowIpCompanies(types[idx]);
          }
        }
      }
    });
    
    var donutCtx = document.getElementById('ipDonutChart');
    if (donutCtx) {
      var byCount = ipData.byCount || [];
      new Chart(donutCtx, {
        type: 'doughnut',
        data: {
          labels: ['0类', '1类', '2类', '3类', '4类'],
          datasets: [{ data: byCount, backgroundColor: paletteDoughnut }]
        },
        options: {
          responsive: false,
          cutout: '55%',
          plugins: {
            legend: { position: 'right', labels: { boxWidth: 12, font: { size: 10 } } },
            tooltip: { 
              callbacks: { 
                label: function(ctx) { 
                  var desc = ['无IP', '有1类', '有2类', '有3类', '4类齐全'];
                  return ctx.label + ' (' + desc[ctx.dataIndex] + '): ' + ctx.raw + '家';
                }
              }
            }
          },
          onClick: function(evt, items) {
            if (items.length > 0) {
              var idx = items[0].index;
              var desc = ['无IP', '有1类', '有2类', '有3类', '4类齐全'];
              ovShowIpByCount(idx, desc[idx]);
            }
          }
        }
      });
    }
  }
  
  // ── 点击图表钻取：弹出对应公司清单 ──

// ── IP Overview Charts ──
  // ── 点击图表钻取：弹出对应公司清单 ──
  function ovShowIpCompanies(type) {
    var allComps = (__DATA__.allCompanies || window._ovAllCompanies || []);
    var typeLabel = {patent:'专利', soft:'软著', honor:'荣誉资质', cert:'资质证书'}[type];
    var colTitle = {patent:'专利数', soft:'软著数', honor:'资质项数', cert:'证书数'}[type];
    var matches = [];
    allComps.forEach(function(c) {
      var qd = c._qcc_data || {};
      var val = 0, detail = '';
      if (type === 'patent') {
        val = qd.patentCount || 0;
        if (val === 0) return;
        detail = val + ' 项';
      } else if (type === 'soft') {
        val = qd.softCopyrightCount || 0;
        if (val === 0) return;
        detail = val + ' 项';
      } else if (type === 'honor') {
        var h = qd.honors || [];
        if (!h.length) return;
        val = h.length;
        detail = Array.from(new Set(h)).join('、');
      } else if (type === 'cert') {
        var ct = qd.certificates || [];
        if (!ct.length) return;
        val = ct.length;
        detail = Array.from(new Set(ct)).join('、');
      }
      var st = c['经营状态'] || ''; matches.push({name: c['公司名称'], category: c['类别'], detail: detail, id: c._id || '', status: st});
    });
    matches.sort(function(a,b){return a.name.localeCompare(b.name,'zh-CN');});
    var rows = matches.map(function(m){
      var sc = m.status === '经营中' ? '#43a047' : (m.status === '注销' ? '#e53935' : '#fb8c00');
      return '<tr>' +
        '<td style="padding:8px 10px;border-bottom:1px solid #f0f0f0;font-weight:500;"><a href="javascript:void(0)" onclick="ovOpenIpCompanyDetail(\'' + m.id + '\')" style="color:#1a237e;text-decoration:none;" onmouseover="this.style.textDecoration=\'underline\'" onmouseout="this.style.textDecoration=\'none\'">' + m.name + '</a></td>' +
        '<td style="padding:8px 10px;border-bottom:1px solid #f0f0f0;color:#666;font-size:12px;">' + m.category + '</td>' +
        '<td style="padding:8px 10px;border-bottom:1px solid #f0f0f0;font-size:12px;">' + m.detail + '</td>' +
        '<td style="padding:8px 10px;border-bottom:1px solid #f0f0f0;color:' + sc + ';font-size:12px;">' + (m.status || '-') + '</td>' +
      '</tr>';
    }).join('');
    var html = '<div style="background:#fff;border-radius:12px;width:min(900px,95vw);max-height:80vh;display:flex;flex-direction:column;box-shadow:0 8px 40px rgba(0,0,0,.25);">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid #e0e0e0;background:#1a237e;border-radius:12px 12px 0 0;">' +
        '<span style="color:#fff;font-weight:600;font-size:15px;">📋 拥有' + typeLabel + '的公司（共 ' + matches.length + ' 家）</span>' +
        '<button onclick="document.getElementById(\'ovIpDrillModal\').remove()" style="background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:6px;padding:4px 14px;cursor:pointer;font-size:13px;">✕ 关闭</button>' +
      '</div>' +
      '<div style="overflow-y:auto;padding:0;">' +
        '<table style="width:100%;border-collapse:collapse;font-size:13px;">' +
          '<thead><tr style="background:#f5f7fa;position:sticky;top:0;">' +
            '<th style="padding:10px;text-align:left;border-bottom:2px solid #e0e0e0;">公司名称</th>' +
            '<th style="padding:10px;text-align:left;border-bottom:2px solid #e0e0e0;">类别</th>' +
            '<th style="padding:10px;text-align:left;border-bottom:2px solid #e0e0e0;">' + colTitle + '</th>' +
            '<th style="padding:10px;text-align:center;border-bottom:2px solid #e0e0e0;">经营状态</th>' +
          '</tr></thead>' +
          '<tbody>' + (rows || '<tr><td colspan="4" style="padding:20px;text-align:center;color:#999;">暂无数据</td></tr>') + '</tbody>' +
        '</table>' +
      '</div>' +
    '</div>';
    var existing = document.getElementById('ovIpDrillModal');
    if (existing) existing.remove();
    var modal = document.createElement('div');
    modal.id = 'ovIpDrillModal';
    modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:9999;';
    modal.innerHTML = html;
    modal.addEventListener('click', function(e){ if(e.target===modal) modal.remove(); });
    document.body.appendChild(modal);
  }

  function ovShowIpByCount(count, desc) {
    var allComps = (__DATA__.allCompanies || window._ovAllCompanies || []);
    var details = (__DATA__.companyDetails || {});
    var matches = [];
    allComps.forEach(function(c) {
      var cId = c._id || c.id;
      var qd = c._qcc_data || (cId ? details[cId]?._qcc_data : null) || {};
      var pc = qd.patentCount || 0;
      var sc = qd.softCopyrightCount || 0;
      var hn = (qd.honors || []).length;
      var cn = (qd.certificates || []).length;
      if (pc === 0 && c['知识产权_专利']) { var ep = parseInt(c['知识产权_专利']); if (!isNaN(ep)) pc = ep; }
      if (sc === 0 && c['软著']) { var es = parseInt(c['软著']); if (!isNaN(es)) sc = es; }
      var cnt = (pc>0?1:0) + (sc>0?1:0) + (hn>0?1:0) + (cn>0?1:0);
      if (cnt === count) {
        var ips = [];
        if (pc > 0) ips.push('专利' + pc);
        if (sc > 0) ips.push('软著' + sc);
        if (hn > 0) ips.push('荣誉' + hn + '项');
        if (cn > 0) ips.push('证书' + cn + '项');
        var st2 = c['经营状态'] || ''; matches.push({name: c['公司名称'], category: c['类别'], ips: ips, id: c._id || '', status: st2});
      }
    });
    matches.sort(function(a,b){return a.name.localeCompare(b.name,'zh-CN');});
    var rows = matches.map(function(m){
      var sc2 = m.status === '经营中' ? '#43a047' : (m.status === '注销' ? '#e53935' : '#fb8c00');
      return '<tr>' +
        '<td style="padding:8px 10px;border-bottom:1px solid #f0f0f0;font-weight:500;"><a href="javascript:void(0)" onclick="ovOpenIpCompanyDetail(\'' + m.id + '\')" style="color:#1a237e;text-decoration:none;" onmouseover="this.style.textDecoration=\'underline\'" onmouseout="this.style.textDecoration=\'none\'">' + m.name + '</a></td>' +
        '<td style="padding:8px 10px;border-bottom:1px solid #f0f0f0;color:#666;font-size:12px;">' + m.category + '</td>' +
        '<td style="padding:8px 10px;border-bottom:1px solid #f0f0f0;font-size:12px;">' + m.ips.join('、') + '</td>' +
        '<td style="padding:8px 10px;border-bottom:1px solid #f0f0f0;color:' + sc2 + ';font-size:12px;">' + (m.status || '-') + '</td>' +
      '</tr>';
    }).join('');
    var html = '<div style="background:#fff;border-radius:12px;width:min(900px,95vw);max-height:80vh;display:flex;flex-direction:column;box-shadow:0 8px 40px rgba(0,0,0,.25);">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid #e0e0e0;background:#1a237e;border-radius:12px 12px 0 0;">' +
        '<span style="color:#fff;font-weight:600;font-size:15px;">📋 ' + desc + ' 的公司（共 ' + matches.length + ' 家）</span>' +
        '<button onclick="document.getElementById(\'ovIpDrillModal\').remove()" style="background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:6px;padding:4px 14px;cursor:pointer;font-size:13px;">✕ 关闭</button>' +
      '</div>' +
      '<div style="overflow-y:auto;padding:0;">' +
        '<table style="width:100%;border-collapse:collapse;font-size:13px;">' +
          '<thead><tr style="background:#f5f7fa;position:sticky;top:0;">' +
            '<th style="padding:10px;text-align:left;border-bottom:2px solid #e0e0e0;">公司名称</th>' +
            '<th style="padding:10px;text-align:left;border-bottom:2px solid #e0e0e0;">类别</th>' +
            '<th style="padding:10px;text-align:left;border-bottom:2px solid #e0e0e0;">已有知识产权</th>' +
            '<th style="padding:10px;text-align:center;border-bottom:2px solid #e0e0e0;">经营状态</th>' +
          '</tr></thead>' +
          '<tbody>' + (rows || '<tr><td colspan="4" style="padding:20px;text-align:center;color:#999;">暂无数据</td></tr>') + '</tbody>' +
        '</table>' +
      '</div>' +
    '</div>';
    var existing = document.getElementById('ovIpDrillModal');
    if (existing) existing.remove();
    var modal = document.createElement('div');
    modal.id = 'ovIpDrillModal';
    modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:9999;';
    modal.innerHTML = html;
    modal.addEventListener('click', function(e){ if(e.target===modal) modal.remove(); });
    document.body.appendChild(modal);
  }

</script>
