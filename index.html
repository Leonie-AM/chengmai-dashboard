<title>诚迈科技对外投资看板（独立版）</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif; background:#f0f2f5; color:#333; min-height:100vh; }

/* ── 顶部 ── */
.header { background: linear-gradient(135deg, #1a237e 0%, #283593 100%); color:#fff; padding:20px 32px; }
.header h1 { font-size:22px; font-weight:600; }
.header .sub { font-size:13px; opacity:.7; margin-top:4px; }

/* ── 标签导航 ── */
.tab-btn { padding:7px 20px; border:1px solid rgba(255,255,255,.3); border-radius:6px; background:rgba(255,255,255,.1); color:#fff; cursor:pointer; font-size:13px; transition:all .2s; }
.tab-btn:hover { background:rgba(255,255,255,.2); }
.tab-btn.active { background:#fff; color:#1a237e; font-weight:600; border-color:#fff; }

/* ── 评分等级徽章 ── */
.grade-badge { display:inline-block; padding:3px 12px; border-radius:12px; font-size:12px; font-weight:600; min-width:36px; text-align:center; }
.grade-A { background:#e8f5e9; color:#2e7d32; }
.grade-B { background:#e3f2fd; color:#1565c0; }
.grade-C { background:#fff8e1; color:#f57f17; }
.grade-D { background:#fce4ec; color:#c62828; }
.grade-E { background:#fff3e0; color:#e65100; }
.grade-F { background:#f5f5f5; color:#9e9e9e; }
.grade-参股 { background:#f3e5f5; color:#6a1b9a; }

/* ── 数据覆盖条 ── */
.coverage-bar { display:flex; align-items:center; gap:6px; }
.coverage-bar .bar-bg { flex:1; height:6px; background:#e0e0e0; border-radius:3px; overflow:hidden; min-width:60px; }
.coverage-bar .bar-fill { height:100%; border-radius:3px; transition:width .3s; }
.coverage-bar .val { font-size:11px; color:#888; white-space:nowrap; }

/* ── 红牌标记 ── */
.red-card-dot { display:inline-block; width:8px; height:8px; background:#e53935; border-radius:50%; }

/* ── 统计卡片 ── */
.stats-row { display:flex; gap:16px; padding:20px 32px; margin-top:-10px; }
.stat-card { flex:1; background:#fff; border-radius:10px; padding:18px 20px; box-shadow:0 1px 4px rgba(0,0,0,.08); display:flex; align-items:center; gap:14px; }
.stat-card .icon { width:44px; height:44px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:20px; }
.stat-card .icon.blue { background:#e3f2fd; color:#1565c0; }
.stat-card .icon.green { background:#e8f5e9; color:#2e7d32; }
.stat-card .icon.orange { background:#fff3e0; color:#e65100; }
.stat-card .icon.purple { background:#f3e5f5; color:#6a1b9a; }
.stat-card .val { font-size:26px; font-weight:700; }
.stat-card .lbl { font-size:12px; color:#888; margin-top:2px; }

/* ── 主布局 ── */
.main { display:flex; gap:16px; padding:0 32px 24px; }
.sidebar { width:220px; flex-shrink:0; }
.content { flex:1; min-width:0; }

/* ── 搜索栏 ── */
.search-box { background:#fff; border-radius:10px; padding:16px 20px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:16px; }
.search-box input { width:100%; border:1px solid #e0e0e0; border-radius:8px; padding:10px 14px; font-size:14px; outline:none; transition:border .2s; }
.search-box input:focus { border-color:#1a237e; }

/* ── 筛选面板 ── */
.filter-panel { background:#fff; border-radius:10px; padding:0; box-shadow:0 1px 4px rgba(0,0,0,.08); overflow:hidden; }
.filter-panel-header { display:flex; align-items:center; justify-content:space-between; padding:12px 14px 10px; border-bottom:1px solid #f0f0f0; }
.filter-panel-header h3 { font-size:13px; font-weight:600; color:#444; margin:0; }
.filter-panel-header .reset-all { font-size:11px; color:#1a237e; cursor:pointer; padding:2px 8px; border-radius:4px; border:1px solid #c5cae9; background:#f3f4fb; transition:all .15s; }
.filter-panel-header .reset-all:hover { background:#e8eaf6; }
.filter-group { border-bottom:1px solid #f5f5f5; padding:10px 14px; }
.filter-group:last-child { border-bottom:none; }
.filter-group-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.filter-group-header .title { font-size:12px; color:#666; font-weight:600; display:flex; align-items:center; gap:5px; }
.filter-group-header .badge { display:inline-flex; align-items:center; justify-content:center; min-width:18px; height:18px; padding:0 5px; border-radius:9px; font-size:10px; font-weight:700; background:#1a237e; color:#fff; line-height:1; }
.filter-group-header .clear-group { font-size:11px; color:#e53935; cursor:pointer; padding:1px 6px; border-radius:4px; border:1px solid #ffcdd2; background:#fff8f8; transition:all .15s; display:none; }
.filter-group-header .clear-group:hover { background:#fce4ec; }
.filter-group-header .clear-group.visible { display:inline-block; }
.filter-group .tags { display:flex; flex-wrap:wrap; gap:5px; }
.filter-tag { padding:3px 9px; border-radius:12px; font-size:12px; cursor:pointer; border:1px solid #e0e0e0; background:#fafafa; color:#666; transition:all .15s; user-select:none; line-height:1.5; }
.filter-tag:hover { border-color:#3f51b5; color:#3f51b5; background:#f0f2ff; }
.filter-tag.active { background:#1a237e; color:#fff; border-color:#1a237e; }
.filter-tag.active:hover { background:#283593; }
  .filter-group .show-more { font-size:11px; color:#1a237e; cursor:pointer; margin-top:5px; display:inline-flex; align-items:center; gap:2px; padding:2px 0; }

/* ── 总览页样式 ── */
#overview-topbar { background:linear-gradient(135deg,#1a237e 0%,#283593 100%); color:#fff; padding:10px 28px; display:flex; align-items:center; justify-content:space-between; box-shadow:0 2px 8px rgba(0,0,0,.15); }
.ov-chart-grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; }
.ov-chart-grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; margin-bottom:20px; }
.ov-card { background:#fff; border-radius:12px; padding:20px; box-shadow:0 2px 8px rgba(0,0,0,.06); transition:box-shadow .2s; }
.ov-card:hover { box-shadow:0 4px 16px rgba(0,0,0,.1); }
.ov-card h3 { font-size:14px; font-weight:600; color:#333; margin-bottom:14px; display:flex; align-items:center; gap:8px; }
.ov-card h3 .dot { width:8px; height:8px; border-radius:50%; }
.ov-table-wrap { max-height:360px; overflow-y:auto; }
.ov-table-wrap table { width:100%; border-collapse:collapse; font-size:13px; }
.ov-table-wrap thead th { position:sticky; top:0; background:#f5f7fa; padding:8px 10px; text-align:left; color:#666; font-weight:600; border-bottom:2px solid #e8e8e8; font-size:12px; }
.ov-table-wrap tbody td { padding:8px 10px; border-bottom:1px solid #f0f0f0; }
.ov-table-wrap tbody tr:hover { background:#fafbff; }
.rank-badge { display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; border-radius:50%; font-size:11px; font-weight:700; color:#fff; }
.rank-1 { background:#f9a825; }
.rank-2 { background:#90a4ae; }
.rank-3 { background:#a1887f; }
.rank-other { background:#e0e0e0; color:#888; }
.filter-group .show-more:hover { text-decoration:underline; }

/* ── 表格 ── */
.table-wrap { background:#fff; border-radius:10px; box-shadow:0 1px 4px rgba(0,0,0,.08); overflow:hidden; }
.table-header { display:flex; align-items:center; justify-content:space-between; padding:14px 20px; border-bottom:1px solid #f0f0f0; }
.table-header .count { font-size:14px; color:#555; }
.table-header .count strong { color:#1a237e; }
.table-scroll { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th { background:#fafafa; padding:10px 14px; text-align:left; font-weight:600; color:#555; white-space:nowrap; border-bottom:1px solid #e8e8e8; cursor:pointer; user-select:none; }
th:hover { background:#f0f0f0; }
th .sort-arrow { margin-left:4px; font-size:10px; }
td { padding:9px 14px; border-bottom:1px solid #f5f5f5; }
tr:hover td { background:#f8f9ff; cursor:pointer; }
.status-badge { display:inline-block; padding:2px 10px; border-radius:10px; font-size:11px; font-weight:500; }
.status-badge.normal { background:#e8f5e9; color:#2e7d32; }

let state = {
  search: '',
  filters: {},

  limit: 30,

  order: 'asc',
  currentDetail: null,

// ── 收入区间定义（万元）──
const REVENUE_RANGE_MAP = {
  '2000万以下':   [null, 2000],
  '2000万-5000万': [2000, 5000],
  '5000万-1亿':   [5000, 10000],
  '1亿以上':      [10000, null],
};

function _filterList(list, params) {
  let result = [...list];
  const search = params.get('search');
  if (search) {
    const q = search.toLowerCase();
    result = result.filter(r =>
      (r['公司名称'] || '').toLowerCase().includes(q) ||
      (r['简称'] || '').toLowerCase().includes(q)
    );
  }
  for (const key of ['类别', '经营状态', '体系平台', '地域', '政府投资协议', '招商承诺', 'grade']) {
    const val = params.get(key);
    if (val) {
      const vals = val.split(',').map(v => v.trim()).filter(Boolean);
      if (key === 'grade') {
        // 评分等级筛选：从 embedded grade 字段匹配
        result = result.filter(r => vals.includes(r['grade'] || ''));
      } else if (vals.length === 1) {
        result = result.filter(r => (r[key] || '') === vals[0]);
      } else if (vals.length > 1) {
        result = result.filter(r => vals.includes(r[key] || ''));
      }
    }
  }
  const revenueRange = params.get('revenue_range');
  const revenueYear = params.get('revenue_year');
  if (revenueRange && revenueYear) {
    const ranges = revenueRange.split(',').map(v => v.trim()).filter(Boolean);
    const yearNum = parseInt(revenueYear);
    result = result.filter(r => {
      const revData = r['revenue_data'] || {};
      const rev = revData[yearNum];
      if (rev == null) return false;
      for (const range of ranges) {
        const bounds = REVENUE_RANGE_MAP[range];
        if (!bounds) continue;
        const [lo, hi] = bounds;
        if ((lo == null || rev >= lo) && (hi == null || rev < hi)) return true;
      }
      return false;
    });
  }
  const sort = params.get('sort') || '序号';
  const order = params.get('order') || 'asc';
  const dir = order === 'desc' ? -1 : 1;
  result.sort((a, b) => {
    let va = a[sort], vb = b[sort];
    if (sort === '注册资本_万元') { va = va || 0; vb = vb || 0; }
    if (va == null && vb == null) return 0;
    if (va == null) return 1;
    if (vb == null) return -1;
    if (typeof va === 'string') va = va.toLowerCase();
    if (typeof vb === 'string') vb = vb.toLowerCase();
    return (va < vb ? -1 : va > vb ? 1 : 0) * dir;
  });
  const page = Math.max(1, parseInt(params.get('page')) || 1);
  const limit = Math.max(1, Math.min(100, parseInt(params.get('limit')) || 30));
  const total = result.length;
  const pages = Math.ceil(total / limit);
  const skip = (page - 1) * limit;
  const data = result.slice(skip, skip + limit);
  return { total, page, limit, pages, data };
}

async function api(path) {
  let url;
  try {
    url = new URL(path, window.location.origin || 'http://127.0.0.1:5000');
  } catch(e) {
    url = new URL('http://127.0.0.1:5000' + path);
  }
  const params = new URLSearchParams(url.search);
  const pathOnly = url.pathname;

  if (pathOnly === '/api/stats' || path === '/api/stats')
    return __DATA__.stats;

  if (pathOnly === '/api/filters' || path === '/api/filters')
    return __DATA__.filters;

  if (pathOnly === '/api/score-summary' || path === '/api/score-summary')
    return __DATA__.scoreSummary;

  const companyIdMatch = pathOnly.match(/^\/api\/companies\/([\w-]+)$/);
  if (companyIdMatch) {
    const detail = __DATA__.companyDetails[companyIdMatch[1]];
    if (!detail) throw new Error('公司不存在');
    return detail;
  }

  if (pathOnly === '/api/companies')
    return _filterList(__DATA__.allCompanies, params);

  const scoreIdMatch = pathOnly.match(/^\/api\/scores\/([\w-]+)$/);
  if (scoreIdMatch) {
    const detail = __DATA__.scoreDetails[scoreIdMatch[1]];
    if (!detail) throw new Error('评分数据不存在');
    return detail;
  }

  if (pathOnly === '/api/scores') {
    let results = [...__DATA__.allScores];
    const search = params.get('search');
    if (search) {
      const q = search.toLowerCase();
      results = results.filter(r => (r.company_name || '').toLowerCase().includes(q));
    }
    const grade = params.get('grade');
    if (grade) {
      results = results.filter(r => grade === 'can_gu' ? r.is_cangu : r.grade === grade);
    }
    const sort = params.get('sort') || 'total_score';
    const order = params.get('order') || 'desc';
    const dir = order === 'desc' ? -1 : 1;
    results.sort((a, b) => {
      let va = (sort === 'name' || sort === 'company_name')
        ? (a.company_name || '') : (a[sort] != null ? a[sort] : -999);
      let vb = (sort === 'name' || sort === 'company_name')
        ? (b.company_name || '') : (b[sort] != null ? b[sort] : -999);
      if (typeof va === 'string') va = va.toLowerCase();
      if (typeof vb === 'string') vb = vb.toLowerCase();
      return (va < vb ? -1 : va > vb ? 1 : 0) * dir;
    });
    const gc = {};
    for (const r of results) {
      const g = r.grade || (r.is_cangu ? '参股' : '');
      if (g) gc[g] = (gc[g] || 0) + 1;
    }
    return { total: results.length, grade_counts: gc, data: results };
  }

  if (pathOnly === '/api/overview' || path === '/api/overview')
    return __DATA__.overview;

  throw new Error('Unknown API: ' + path);
}

function showError(msg) {
  var statTotal = document.getElementById('statTotal');
  if (statTotal && (statTotal.textContent === '-' || statTotal.textContent === 'ERROR')) {
    document.getElementById('statTotal').textContent = 'ERROR';
    document.getElementById('statNormal').textContent = 'ERROR';
    document.getElementById('statCapital').textContent = 'ERROR';
    document.getElementById('statCategories').textContent = 'ERROR';
  }
  document.getElementById('tableBody').innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px;color:#e53935;">⚠️ 加载失败：' + msg + '<br><small>请确认数据是否正确导出，或按 F12 查看控制台详细错误</small></td></tr>';
}


async function loadStats() {
  try {
    const data = await api('/api/stats');
    document.getElementById('statTotal').textContent = data.total_companies || 0;
    document.getElementById('statNormal').textContent = data.normal_operation || 0;
    document.getElementById('statCapital').textContent = Math.round(data.total_registered_capital || 0).toLocaleString();
    document.getElementById('statCategories').textContent = (data.categories || []).length;
  } catch(e) { showError(e.message); }
}

          return `<span class="filter-tag revenue-range-tag" data-val="${v}" onclick="toggleRevenueRange(this,'${escV}')">${v}</span>`;
        }).join('')}
      </div>
      <div style="font-size:10px;color:#bbb;margin-top:5px;">单位：万元 · 来源：汇总财务数据</div>
    </div>`;

    // ── 2. 评分等级筛选组 ──
    const gradeOptions = ['A', 'B', 'C', 'D', 'E', 'F', '参股'];
    const gradeKey = 'grade';
    html += `<div class="filter-group" id="group_grade">
      <div class="filter-group-header">
        <span class="title">⭐ 评分等级
          <span class="badge" id="badge_grade" style="display:none;"></span>
        </span>
        <span class="clear-group" id="clear_grade" onclick="clearGroup('grade')">清除</span>
      </div>
      <div class="tags" id="tags_grade">
        ${gradeOptions.map(v => {
          const escV = v.replace(/'/g, "\\'");
          return `<span class="filter-tag" data-key="grade" data-val="${v}" onclick="toggleFilter(this,'grade','${escV}')">${v}</span>`;
        }).join('')}
      </div>
    </div>`;

    // ── 3-6. 投资类别 / 经营状态 / 体系平台 / 地域 ──
    const groups = [
      { key: '类别', label: '投资类别', icon: '📁' },
      { key: '经营状态', label: '经营状态', icon: '🏷️' },
      { key: '体系平台', label: '体系平台', icon: '🔲' },
      { key: '地域', label: '地域', icon: '📍' },
    ];

    for (const g of groups) {
      const vals = data[g.key] || [];
      if (!vals.length) continue;
      const INIT_SHOW = 8;
      const hasMore = vals.length > INIT_SHOW;
      const escKey = g.key.replace(/'/g, "\\'");

      html += `<div class="filter-group" id="group_${g.key}">
        <div class="filter-group-header">
          <span class="title">${g.icon} ${g.label}
            <span class="badge" id="badge_${g.key}" style="display:none;"></span>
          </span>
          <span class="clear-group" id="clear_${g.key}" onclick="clearGroup('${escKey}')">清除</span>
        </div>
        <div class="tags" id="tags_${g.key}">`;

      for (let i = 0; i < vals.length; i++) {
        const v = vals[i];
        const escV = v.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        const hidden = (hasMore && i >= INIT_SHOW) ? ' style="display:none;"' : '';
        html += `<span class="filter-tag" data-key="${g.key}" data-val="${v}" onclick="toggleFilter(this,'${escKey}','${escV}')"${hidden}>${v}</span>`;
      }

      if (hasMore) {
        html += `<span class="show-more" id="more_${g.key}" onclick="toggleMore('${escKey}')">
          <span id="more_icon_${g.key}">▾</span> 展开更多 (${vals.length - INIT_SHOW})
        </span>`;
      }

      html += `</div></div>`;
    }

    // ── 7-8. 政府投资协议 / 招商承诺（20260701新增）──
    const govGroups = [
      { key: '政府投资协议', label: '政府投资协议', icon: '🏛️', vals: (data['政府投资协议']||[]).filter(v => v !== 'nan') },
      { key: '招商承诺', label: '招商承诺', icon: '📋', vals: (data['招商承诺']||[]).filter(v => v !== 'nan') },
    ];

    for (const g of govGroups) {
      const vals = g.vals;
      if (!vals.length) continue;
      const escKey = g.key.replace(/'/g, "\\'");

      html += `<div class="filter-group" id="group_${g.key}">
        <div class="filter-group-header">
          <span class="title">${g.icon} ${g.label}
            <span class="badge" id="badge_${g.key}" style="display:none;"></span>
          </span>
          <span class="clear-group" id="clear_${g.key}" onclick="clearGroup('${escKey}')">清除</span>
        </div>
        <div class="tags" id="tags_${g.key}">`;

      for (let i = 0; i < vals.length; i++) {
        const v = vals[i];
        const escV = v.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        html += `<span class="filter-tag" data-key="${g.key}" data-val="${v}" onclick="toggleFilter(this,'${escKey}','${escV}')">${v}</span>`;
      }

      html += `</div></div>`;
    }

    panel.innerHTML = html;
  } catch(e) { console.error('加载筛选器失败:', e); }
}

// ── 展开/收起更多选项 ──
function toggleMore(key) {
  const tags = document.querySelectorAll(`#tags_${key} .filter-tag[style*="none"]`);
  const allTags = document.querySelectorAll(`#tags_${key} .filter-tag`);
  const moreBtn = document.getElementById('more_' + key);
  const moreIcon = document.getElementById('more_icon_' + key);
  const INIT_SHOW = 8;

  if (tags.length > 0) {
    // 展开
    allTags.forEach(t => t.style.display = '');
    moreIcon.textContent = '▴';
    moreBtn.innerHTML = `<span id="more_icon_${key}">▴</span> 收起`;
  } else {
    // 收起（但保留已选中的显示）
    allTags.forEach((t, i) => {
      if (i >= INIT_SHOW && !t.classList.contains('active')) {
        t.style.display = 'none';
      }
    });
    moreIcon.textContent = '▾';
    const hiddenCount = Array.from(allTags).filter((t,i) => i >= INIT_SHOW && !t.classList.contains('active')).length;
    moreBtn.innerHTML = `<span id="more_icon_${key}">▾</span> 展开更多 (${hiddenCount})`;
  }
}

// ── 筛选切换（多选） ──
function toggleFilter(el, key, val) {
  if (!state.filters[key]) state.filters[key] = new Set();
  const s = state.filters[key];

  if (el.classList.contains('active')) {
    el.classList.remove('active');
    s.delete(val);
    if (s.size === 0) delete state.filters[key];
  } else {
    el.classList.add('active');
    s.add(val);
  }

  // 更新徽章和清除按钮
  _updateGroupUI(key);
  state.page = 1;
  loadCompanies();
}

// ── 清除单组 ──
function clearGroup(key) {
  delete state.filters[key];
  document.querySelectorAll(`#tags_${key} .filter-tag.active`).forEach(el => el.classList.remove('active'));
  _updateGroupUI(key);
  state.page = 1;
  loadCompanies();
}

// ── 更新组徽章 ──
function _updateGroupUI(key) {
  const s = state.filters[key];
  const count = s ? s.size : 0;
  const badge = document.getElementById('badge_' + key);
  const clearBtn = document.getElementById('clear_' + key);
  if (badge) {
    badge.textContent = count;
    badge.style.display = count > 0 ? 'inline-flex' : 'none';
  }
  if (clearBtn) {
    clearBtn.classList.toggle('visible', count > 0);
  }
}

// ── 年收入规模筛选 ──
function toggleRevenueRange(el, val) {
  if (el.classList.contains('active')) {
    el.classList.remove('active');
    state.revenueRanges.delete(val);
  } else {
    el.classList.add('active');
    state.revenueRanges.add(val);
  }
  _updateRevenueUI();
  state.page = 1;
  loadCompanies();
}

function onRevenueYearChange(year) {
  state.revenueYear = year;
  if (state.revenueRanges.size > 0) {
    state.page = 1;
    loadCompanies();
  }
}

function clearRevenueFilter() {
  state.revenueRanges.clear();
  document.querySelectorAll('.revenue-range-tag.active').forEach(el => el.classList.remove('active'));
  _updateRevenueUI();
  state.page = 1;
  loadCompanies();
}

function _updateRevenueUI() {
  const count = state.revenueRanges.size;
  const badge = document.getElementById('badge_revenue');
  const clearBtn = document.getElementById('clear_revenue');
  if (badge) {
    badge.textContent = count;
    badge.style.display = count > 0 ? 'inline-flex' : 'none';
  }
  if (clearBtn) {
    clearBtn.classList.toggle('visible', count > 0);
  }
}

// ── 搜索 ──
let searchTimer;
function doSearch() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.search = document.getElementById('searchInput').value.trim();
    state.page = 1;
    loadCompanies();
  }, 300);
}

// ── 排序 ──
function setSort(field) {
  if (state.sort === field) {
    state.order = state.order === 'asc' ? 'desc' : 'asc';
  } else {
    state.sort = field;
    state.order = 'asc';
  }
  loadCompanies();
}

// ── 加载公司列表 ──
async function loadCompanies() {
  try {
    const params = new URLSearchParams();
  if (state.search) params.set('search', state.search);
  for (const k of Object.keys(state.filters)) {
    const valSet = state.filters[k];
    const vals = (valSet instanceof Set) ? Array.from(valSet) : [valSet];
    // 用逗号合并多个值，后端用 split(',') 解析（避免中文键名重复参数的兼容问题）
    if (vals.length > 0) {
      params.set(k, vals.join(','));
    }
  }
  // 年收入规模筛选
  if (state.revenueRanges.size > 0) {
    params.set('revenue_range', Array.from(state.revenueRanges).join(','));
    params.set('revenue_year', state.revenueYear);
  }
  params.set('page', state.page);
  params.set('limit', state.limit);
  params.set('sort', state.sort);
  params.set('order', state.order);

  const data = await api('/api/companies?' + params.toString());
  document.getElementById('resultCount').textContent = data.total;

  // 表格
  const tbody = document.getElementById('tableBody');
  if (!data.data || !data.data.length) {
    tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;padding:40px;color:#999;">暂无数据</td></tr>';
  } else {
    tbody.innerHTML = data.data.map(row => {
      const statusClass = row['经营状态'] === '正常经营' ? 'normal' :
        (row['经营状态'] && row['经营状态'].includes('新设')) ? 'new' :
        (row['经营状态'] && (row['经营状态'].includes('注销') || row['经营状态'].includes('未经营'))) ? 'inactive' : 'other';
      // 评分显示
      const grade = row['grade'] || '';
      const gradeColor = {A:'#2e7d32',B:'#1565c0',C:'#f57f17',D:'#c62828',E:'#e65100',F:'#555'}[grade] || '#888';
      const scoreHtml = row['total_score'] != null
        ? `<span style="font-weight:600;color:${gradeColor};">${row['total_score'].toFixed(1)}</span><small style="color:#aaa;font-size:10px;"> ${grade}</small>`
        : `<small style="color:#ccc;">-</small>`;
      // 阶段显示
      const stageHtml = row['stage'] ? `<span style="font-size:12px;color:#555;">${row['stage']}</span>` : '-';
      // 红牌显示
      const redHtml = row['red_count'] > 0
        ? `<span style="color:#c62828;font-weight:600;font-size:12px;">🚩${row['red_codes']}</span>`
        : '<span style="color:#ccc;font-size:12px;">-</span>';
      return `<tr onclick="openDetail('${row._id}')">
        <td>${row['序号'] || ''}</td>
        <td><strong>${row['公司名称'] || ''}</strong>${row['简称'] ? '<br><small style="color:#999">' + row['简称'] + '</small>' : ''}</td>
        <td>${row['类别'] || ''}</td>
        <td><span class="status-badge ${statusClass}">${row['经营状态'] || ''}</span></td>
        <td style="text-align:center;">${scoreHtml}</td>
        <td style="text-align:center;">${stageHtml}</td>
        <td>${row['体系平台'] || ''}</td>
        <td>${row['地域'] || ''}</td>
        <td>${row['注册资本_万元'] ? Math.round(row['注册资本_万元']).toLocaleString() : '-'}</td>
        <td style="text-align:center;">${redHtml}</td>
      </tr>`;
    }).join('');
  }

  // 分页
  const pag = document.getElementById('pagination');
  pag.innerHTML = `
    <button ${state.page <= 1 ? 'disabled' : ''} onclick="goPage(${state.page - 1})">上一页</button>
    <span class="page-info">第 ${state.page} / ${data.pages} 页，共 ${data.total} 条</span>
    <button ${state.page >= data.pages ? 'disabled' : ''} onclick="goPage(${state.page + 1})">下一页</button>
  `;
  } catch(e) { showError(e.message); }
}

function goPage(p) { state.page = p; loadCompanies(); }
function resetFilters() {
  // 重置多选状态
  const keys = Object.keys(state.filters);
  state.filters = {};
  state.search = '';
  state.page = 1;
  document.getElementById('searchInput').value = '';
  document.querySelectorAll('#filterPanel .filter-tag.active').forEach(el => el.classList.remove('active'));
  // 重置各组徽章
  keys.forEach(k => _updateGroupUI(k));
  // 也重置所有组（防止漏网之鱼）
  ['grade','类别','经营状态','体系平台','地域'].forEach(k => _updateGroupUI(k));
  // 重置年收入规模筛选
  state.revenueRanges = new Set();
  state.revenueYear = '2024';
  document.querySelectorAll('.revenue-range-tag.active').forEach(el => el.classList.remove('active'));
  const sel = document.getElementById('revenueYearSelect');
  if (sel) sel.value = '2024';
  _updateRevenueUI();
  loadCompanies();
}

async function openDetail(id) {

  document.getElementById('detailBody').innerHTML = '<div class="loading">加载中...</div>';

function closeDetail() {
  if (_detailScoreChart) { _detailScoreChart.destroy(); _detailScoreChart = null; }
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('detailPanel').classList.remove('show');
  state.currentDetail = null;

function switchTab(tab, btn) {
  document.querySelectorAll('.detail-tab').forEach(t => t.classList.remove('active'));
  (btn || event.target).classList.add('active');
  
  const data = state.currentDetail;

  switch(tab) {
    case 'score': renderDetailScore(data); break;
    case 'basic': renderBasic(data); break;
    case 'finance': renderFinance(data); break;
    case 'capital': renderCapital(data); break;
    case 'governance': renderGovernance(data); break;
    case 'bet': renderBet(data); break;
  }
}

function fmt(v) {
  if (v === null || v === undefined || v === '' || v === 'NaN') return '-';
  if (typeof v === 'number') return Math.round(v).toLocaleString();
  const s = String(v).trim();
  if (!s) return '-';
  // 清理时间戳
  if (s.match(/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/)) return s.split(' ')[0];
  return s;
}

// 格式化金额（整数，带千分位）
function fmtMoney(v) {
  if (v === null || v === undefined || v === '' || v === 'NaN') return '-';
  const n = typeof v === 'number' ? v : parseFloat(v);
  if (isNaN(n)) return String(v);
  return Math.round(n).toLocaleString();
}

// 格式化比例（显示为百分比，保留1位小数）
function fmtPct(v) {
  if (v === null || v === undefined || v === '' || v === 'NaN') return '-';
  const n = typeof v === 'number' ? v : parseFloat(v);
  if (isNaN(n)) return String(v);
  // 如果原始值已经是百分数形式（>1），直接格式化；否则 *100
  const pct = Math.abs(n) <= 1 ? n * 100 : n;
  return pct.toFixed(1) + '%';
}

function kv(label, val) {
  return `<div class="kv-row"><div class="key">${label}</div><div class="val">${fmt(val)}</div></div>`;
}

function renderFinance(data) {
  const years = ['2022', '2023', '2024', '2025', '2026'];
  let plRows = '';
  let bsRows = '';
  let hasPL = false, hasBS = false;

  for (const y of years) {
    const income = data['收入_' + y];
    const cost = data['营业成本_' + y];
    const profit = data['净利润_' + y];
    const vat = data['增值税_' + y];
    const incomeTax = data['所得税_' + y];
    const totalTax = data['纳税合计_' + y];
    const selling = data['销售费用_' + y];
    const admin = data['管理费用_' + y];
    const rd = data['研发费用_' + y];

    if (income !== undefined || cost !== undefined || profit !== undefined) {
      hasPL = true;
      plRows += `<tr>
        <td>${y}</td>
        <td>${fmtMoney(income)}</td>
        <td>${fmtMoney(cost)}</td>
        <td>${fmtMoney(selling)}</td>
        <td>${fmtMoney(admin)}</td>
        <td>${fmtMoney(rd)}</td>
        <td>${fmtMoney(profit)}</td>
        <td>${fmtMoney(vat)}</td>
        <td>${fmtMoney(incomeTax)}</td>
        <td>${fmtMoney(totalTax)}</td>
      </tr>`;
    }

    // 资产负债表
    const totalAssets = data['总资产_' + y];
    const netAssets = data['净资产_' + y];
    const cash = data['货币资金_' + y];
    const ar = data['应收账款_' + y];
    const ap = data['应付账款_' + y];
    const payroll = data['应付职工薪酬_' + y];
    const retained = data['未分配利润_' + y];
    const chengmaiLoan = data['诚迈借款_' + y];
    const bankLoan = data['银行贷款_' + y];

    if (totalAssets !== undefined || netAssets !== undefined) {
      hasBS = true;
      bsRows += `<tr>
        <td>${y}</td>
        <td>${fmtMoney(totalAssets)}</td>
        <td>${fmtMoney(netAssets)}</td>
        <td>${fmtMoney(cash)}</td>
        <td>${fmtMoney(ar)}</td>
        <td>${fmtMoney(ap)}</td>
        <td>${fmtMoney(payroll)}</td>
        <td>${fmtMoney(retained)}</td>
        <td>${fmtMoney(chengmaiLoan)}</td>
        <td>${fmtMoney(bankLoan)}</td>
      </tr>`;
    }
  }

  // 收入预测
  let predRows = '';
  let hasPred = false;
  for (const y of ['2024', '2025', '2026', '2027', '2028', '2029']) {
    const revPred = data[y + '收入预测'];
    const npPred = data[y + '净利润预测'];
    if (revPred !== undefined && revPred !== '') {
      hasPred = true;
      predRows += `<tr><td>${y}</td><td>${fmtMoney(revPred)}</td><td>${fmtMoney(npPred)}</td></tr>`;
    }
  }

  let html = '';

  // ── 损益表 ──
  html += `<div class="section"><h4>年度损益表（万元）</h4>`;
  if (hasPL) {
    html += `<table class="data-table" style="font-size:11px;">
      <thead><tr><th>年度</th><th>收入</th><th>营业成本</th><th>销售费用</th><th>管理费用</th><th>研发费用</th><th>净利润</th><th>增值税</th><th>所得税</th><th>纳税合计</th></tr></thead>
      <tbody>${plRows}</tbody></table>`;
  } else {
    html += `<div style="color:#999;padding:8px;">暂无损益数据</div>`;
  }
  html += `</div>`;

  // ── 资产负债表 ──
  html += `<div class="section"><h4>资产负债表（万元）</h4>`;
  if (hasBS) {
    html += `<table class="data-table" style="font-size:11px;">
      <thead><tr><th>年度</th><th>总资产</th><th>净资产</th><th>货币资金</th><th>应收账款</th><th>应付账款</th><th>应付薪酬</th><th>未分配利润</th><th>诚迈借款</th><th>银行贷款</th></tr></thead>
      <tbody>${bsRows}</tbody></table>`;
  } else {
    html += `<div style="color:#999;padding:8px;">暂无资产负债表数据</div>`;

  // ── 承诺执行情况 ──

function renderBet(data) {
  // 收集对赌数据（按年份）
  const vamYears = [];
  for (const y of ['2024', '2025', '2026']) {
    const v = data['投资对赌_' + y];
    if (v) vamYears.push({year: y, text: v});
  }
  // 从对赌文本中提取回购条款
  let repoText = data['回购'] || '';
  const vamText = data['投资协议对赌_业绩对赌'] || '';
  if (!repoText && vamText.includes('回购')) {
    repoText = vamText;
  }

  // 收集招商承诺数据
  const commitYears = [];
  for (const y of ['2024', '2025', '2026']) {
    const v = data['招商承诺_' + y];
    if (v) commitYears.push({year: y, text: v});
  }

  // 收集招商销量承诺数据
  const salesCommitYears = [];
  for (const y of ['2024', '2025', '2026']) {
    const v = data['招商销量承诺_' + y];
    if (v) salesCommitYears.push({year: y, text: v});
  }

  // 收集收入预测数据
  const predYears = [];
  for (const y of ['2023', '2024', '2025', '2026', '2027', '2028', '2029']) {
    const v = data[y + '收入预测'];
    if (v !== undefined && v !== '' && v !== null) predYears.push({year: y, val: v});
  }

  let html = '';

  // ── 投资协议对赌 ──
  html += `<div class="section"><h4>投资协议对赌</h4>`;
  if (vamText) {
    html += kv('对赌条款', vamText);
  } else {
    html += kv('对赌条款', data['投资协议对赌_业绩对赌']);
  }
  html += kv('回购条款', repoText || data['回购']);
  // 分年对赌
  if (vamYears.length > 0) {
    html += `<h5 style="font-size:12px;color:#1a237e;margin:12px 0 6px;padding-bottom:4px;border-bottom:1px solid #f0f0f0;">分年对赌</h5>`;
    for (const vy of vamYears) {
      html += kv(vy.year + '年', vy.text);
    }
  }
  html += `</div>`;

  // ── 招商承诺 ──
  html += `<div class="section"><h4>招商承诺</h4>`;
  // 投资金额：可能是数字(万元)或文本
  const investAmt = data['招商承诺情况_投资金额'];
  html += kv('投资金额', typeof investAmt === 'number' ? fmtMoney(investAmt) + ' 万元' : investAmt);
  html += kv('收入承诺', data['收入承诺']);
  html += kv('纳税贡献承诺', data['纳税贡献承诺']);
  // 销量承诺：可能是数字(万元)或文本
  const salesAmt = data['招商销量承诺情况'];
  html += kv('销量承诺', typeof salesAmt === 'number' ? fmtMoney(salesAmt) : salesAmt);
  html += kv('其他承诺', data['其他承诺']);
  if (commitYears.length > 0) {
    html += `<h5 style="font-size:12px;color:#1a237e;margin:12px 0 6px;padding-bottom:4px;border-bottom:1px solid #f0f0f0;">分年承诺（收入）</h5>`;
    for (const cy of commitYears) {
      html += kv(cy.year + '年', typeof cy.text === 'number' ? fmtMoney(cy.text) + ' 万元' : cy.text);
    }
  }
  if (salesCommitYears.length > 0) {
    html += `<h5 style="font-size:12px;color:#1a237e;margin:12px 0 6px;padding-bottom:4px;border-bottom:1px solid #f0f0f0;">分年承诺（销量）</h5>`;
    for (const sy of salesCommitYears) {
      const n = typeof sy.text === 'number' ? sy.text : parseFloat(sy.text);
      html += kv(sy.year + '年', !isNaN(n) ? fmtMoney(n) : sy.text);
    }
  }
  html += `</div>`;

  // ── 未来收入利润规划 ──
  html += `<div class="section"><h4>未来收入利润规划</h4>`;
  if (predYears.length > 0) {
    html += `<table class="data-table">
      <thead><tr><th>年度</th><th>收入预测(万元)</th><th>净利润预测(万元)</th></tr></thead><tbody>`;
    for (const py of predYears) {
      const np = data[py.year + '净利润预测'];
      html += `<tr><td>${py.year}</td><td>${fmtMoney(py.val)}</td><td>${fmtMoney(np)}</td></tr>`;
    }
    html += `</tbody></table>`;
  } else {
    html += kv('未来收入利润规划', data['未来收入利润规划_from设立可研__汇总']);
  }
  html += `</div>`;

  // ── 风险提示（相关） ──
  const riskText = data['风险及建议'] || '';
  if (riskText && (riskText.includes('对赌') || riskText.includes('承诺') || riskText.includes('回购'))) {
    html += `<div class="section" style="background:#fff8e1;border:1px solid #ffe082;border-radius:8px;padding:12px;">
      <h4 style="color:#e65100;">⚠️ 风险提示（对赌/承诺相关）</h4>
      <div style="font-size:13px;color:#555;line-height:1.6;">${riskText}</div>
    </div>`;
  }

  document.getElementById('detailBody').innerHTML = html;
}

const INDICATOR_META = {
  // ── 财务健康 ──
  'F1': { name: '净利润完成率', formula: '取近三个完整年度(2023-2025)和当年(2026)实际净利润vs预算，预算优先招商承诺、回退净利润预测，各有效年度权重均分' },
  'F2': { name: '收入完成率', formula: '取近三个完整年度(2023-2025)和当年(2026)实际收入vs预算，预算优先招商承诺、回退收入预测，无预算则同比（增长满分/减少0分），各有效年度权重均分' },
  'F3': { name: '毛利率同比变动', formula: '取近三个完整年度(2023-2025)和当年(2026)，各年同比变动基于行业容忍区间评分，各有效年度权重均分' },
  'F4': { name: '经营性现金流覆盖率', formula: '覆盖率 = 经营性现金净流入 ÷ |净利润| × 100%<br>覆盖率 ≥ 100% → 满分<br>覆盖率 ≤ 0% → 0分' },
  'F5': { name: '资产负债率偏离度', formula: '偏离度 = (子公司资产负债率 - 行业中位数) ÷ 行业中位数 × 100%<br>偏离度 ≤ 0% → 满分<br>偏离度 > 50% → 0分（倒序计分）' },
  'F7': { name: '应收账款占收入比', formula: '占比 = 应收账款余额 ÷ 近12个月滚动营收 × 100%<br>≤ 20% → 满分，> 60% → 0分（倒序计分）' },
  'F8': { name: '亏损收窄率', formula: '亏损收窄率 = (上期亏损 - 本期亏损) ÷ 上期亏损 × 100%<br>收窄率 ≥ 50% → 满分，≤ -20% → 0分<br>仅对上一期存在亏损的公司适用' },
  // ── 合同执行 ──
  'C1': { name: '合同履约率', formula: '履约率 = 按期交付合同数 ÷ 到期合同总数 × 100%<br>≥ 98% → 满分，< 70% → 0分' },
  'C2': { name: '交付延期率', formula: '延期率 = 延期合同数 ÷ 到期合同总数 × 100%<br>0% → 满分，> 20% → 0分（倒序计分）' },
  'C3': { name: '回款率', formula: '回款率 = 实际到账金额 ÷ 合同约定回款金额 × 100%<br>≥ 95% → 满分，< 50% → 0分' },
  'C4': { name: '逾期应收账款占比', formula: '占比 = 逾期90天以上应收 ÷ 应收账款总额 × 100%<br>≤ 3% → 满分，> 35% → 0分（倒序计分）' },
  'C5': { name: '重大合同客户集中度', formula: '集中度 = 最大客户合同金额 ÷ 总收入 × 100%<br>≤ 25% → 满分，> 60% → 0分（倒序计分）' },
  'C6': { name: '合同纠纷率', formula: '纠纷率 = 新发生纠纷件数 ÷ 有效合同总数 × 100%<br>0% → 满分，> 5% → 0分（倒序计分）' },
  // ── 经营质量 ──
  'O1': { name: '核心团队留存率', formula: '全部留存 → 5分<br>流失1人 → 2.5分<br>总经理离职 → 0分' },
  'O3': { name: '人效（人均创收）', formula: '人均创收 = 营业收入 ÷ 月均全职员工数<br>≥ P75 → 满分，< P25 → 0分' },
  'O5': { name: '场地产出效率', formula: '效率 = 近12个月营收（万元）÷ 场地总面积（㎡）× 10000<br>≥ 诚迈科技基准 → 满分<br>< 基准×0.5 → 0分' },
  // ── 合规风控 ──
  'G1': { name: '重大诉讼/行政处罚', formula: '无作为被告的重大未决诉讼且无行政处罚 → 3分<br>有1项 → 0分（离散二值计分）' },
  'G2': { name: '关联交易金额占比', formula: '占比 = 关联交易总额 ÷ 营业收入 × 100%<br>≤ 10% → 2分，10%-30% → 1分，> 30% → 0分' },
  'G3': { name: '重大信息即时报告', formula: '重大事项24h内向证券部报告 → 3分<br>存在迟报 → 0分（离散二值计分）' },
  'G4': { name: '定期报告配合度', formula: '年报/半年报/季报按时准确提供数据 → 2分<br>存在延误或差错 → 0分（离散二值计分）' },
};

// ══════════════════════════════════════
//  投资看板详情面板 — 评分详情标签
// ══════════════════════════════════════
let _detailScoreChart = null;

async function renderDetailScore(companyData) {
  const detailBody = document.getElementById('detailBody');
  detailBody.innerHTML = '<div class="loading">加载评分详情...</div>';

  const data = await api('/api/scores/' + companyData['_id']);

  let html = '';

  // 红牌警告
  if (data.red_cards && data.red_cards.length > 0) {
    html += `<div class="section" style="background:#fff0f0;border:1px solid #ffcdd2;border-radius:8px;padding:12px;margin-bottom:16px;">
      <h4 style="color:#c62828;">🔴 红牌触发</h4>`;
    for (const rc of data.red_cards) {
      html += `<div style="font-size:13px;color:#c62828;padding:2px 0;">${rc.code}: ${rc.desc}</div>`;
    }
    html += `</div>`;
  }

  // 雷达图数据
  const dims = [
    { label: '财务健康\n(50分)', keys: ['F1','F2','F3','F4','F5','F7','F8'], maxWeight: 50 },
    { label: '合同执行\n(25分)', keys: ['C1','C2','C3','C4','C5','C6'], maxWeight: 25 },
    { label: '经营质量\n(15分)', keys: ['O1','O3','O5'], maxWeight: 15 },
    { label: '合规风控\n(10分)', keys: ['G1','G2','G3','G4'], maxWeight: 10 },
  ];
  const radarLabels = [];
  const radarValues = [];

  // 基本信息 + 雷达图（双栏）
  html += `<div class="score-overview">
    <div class="info-col"><div class="section" style="margin-bottom:0;"><h4>基本信息</h4>
      ${kv('公司名称', data.company_name)}
      ${kv('行业', data.industry || '-')}
      ${kv('经营状态', data.business_status || '-')}
      ${kv('阶段', data.stage_label)}
      ${kv('等级', '<span class="grade-badge ' + (data.grade ? 'grade-' + data.grade : '') + '">' + data.grade_label + '</span>')}
      ${kv('总分', data.total_score != null ? data.total_score.toFixed(1) + ' / 100' : '-')}
      ${kv('数据覆盖率', data.data_coverage + '%')}
      ${kv('处置建议', data.recommendation)}
    </div></div>
    <div class="radar-col"><canvas id="radarChartDetail"></canvas></div>
  </div>`;

  // 分维度详情
  if (data.scores && Object.keys(data.scores).length > 0) {
    for (const dim of dims) {
      // 动态计算该维度实际满分（基于当前公司的 max_score，孵化期公司 F2/F3 max=0）
      const actualDimMax = dim.keys.reduce((sum, k) => {
        const s = data.scores[k];
        return sum + (s && s.max_score > 0 ? s.max_score : 0);
      }, 0);
      const dimLabel = dim.label.replace(/\(\d+分\)/, `(${actualDimMax}分)`);
      const dimName = dimLabel.replace('\n', ' ');
      html += `<div class="section"><h4>${dimName}</h4>
        <table class="data-table">
        <thead><tr><th style="width:40px;">编号</th><th style="width:90px;">指标名称</th><th style="width:48px;">得分</th><th style="width:42px;">满分</th><th style="width:45px;">状态</th><th style="width:62px;">数据来源</th><th style="min-width:240px;">计算公式 / 计算过程</th></tr></thead><tbody>`;
      let dimScored = 0, dimMax = 0;
      for (const k of dim.keys) {
        const s = data.scores[k];
        if (!s) continue;
        const meta = INDICATOR_META[k] || { name: k, formula: '-' };
        const icon = s.available ? '✓' : '✗';
        const color = s.available ? '#2e7d32' : '#999';
        const source = s.source || '数据缺失';
        const sourceColor = source === '主Excel' ? '#2e7d32' : source === '补充数据' ? '#e65100' : '#999';
        const sourceBg = source === '主Excel' ? '#e8f5e9' : source === '补充数据' ? '#fff3e0' : '#f5f5f5';
        html += `<tr>
          <td style="font-weight:600;">${k}</td>
          <td style="text-align:left;font-size:12px;">${meta.name}</td>
          <td style="color:${color};font-weight:600;">${s.available ? s.score.toFixed(1) : '-'}</td>
          <td>${s.max_score}</td>
          <td style="font-size:11px;color:${color};">${s.available ? icon : '缺失'}</td>
          <td><span style="display:inline-block;padding:1px 6px;border-radius:8px;font-size:10px;font-weight:600;color:${sourceColor};background:${sourceBg};">${source}</span></td>
          <td style="text-align:left;line-height:1.6;">
            <div style="font-size:10px;color:#888;margin-bottom:3px;border-bottom:1px dashed #e0e0e0;padding-bottom:3px;">${meta.formula}</div>
            <div style="font-size:11px;color:${s.available ? '#1a237e' : '#999'};">${s.detail || '（无数据）'}</div>
          </td>
        </tr>`;
        // 满分总是累加（包含数据缺失项），得分只累加有数据的
        if (s.max_score > 0) { dimMax += s.max_score; }
        if (s.available) { dimScored += Math.min(s.score, s.max_score); }
      }
      const dimTotal = dimMax > 0 ? Math.round(dimScored / dimMax * 100) : 0;
      html += `<tr style="font-weight:600;background:#fafafa;">
        <td colspan="3">维度合计</td>
        <td>${dimScored.toFixed(1)}</td><td>${dimMax}</td>
        <td style="color:#1a237e;">${dimTotal}%</td>
        <td></td>
        <td>得分率 = ${dimScored.toFixed(1)} ÷ ${dimMax} × 100</td>
      </tr>`;
      html += `</tbody></table></div>`;

      radarLabels.push(dim.label.replace('\n', ''));
      radarValues.push(dimTotal);
    }
  }

  detailBody.innerHTML = html;

  // 绘制雷达图
  setTimeout(() => {
    const canvas = document.getElementById('radarChartDetail');
    if (!canvas) return;
    if (_detailScoreChart) { _detailScoreChart.destroy(); _detailScoreChart = null; }
    if (typeof Chart === 'undefined') return;
    _detailScoreChart = new Chart(canvas, {
      type: 'radar',
      data: {
        labels: radarLabels,
        datasets: [{
          label: '各维度得分率 (%)',
          data: radarValues,

function toggleOverview() {
  console.log('toggleOverview called, current state:', state.overviewVisible);
  const vp = document.getElementById('view-portfolio');
  const btn = document.getElementById('btnOverview');
  const pBtn = document.getElementById('btnPartners');

  if (!state.overviewVisible) {
    // ── 进入总览：先关闭合资方监控（如果打开）──
    if (window._partnersVisible) {
      window._partnersVisible = false;
      pBtn.style.background = '';
      pBtn.style.color = '#c5cae9';
    }
    console.log('>>> SWITCHING TO OVERVIEW');
    if (!window._portfolioHtml) {
      window._portfolioHtml = vp.innerHTML;
      console.log('Saved portfolio HTML, length:', window._portfolioHtml.length);
    }
    vp.innerHTML = window._overviewTemplate;
    console.log('Overview template injected, vp children:', vp.children.length);

    // 销毁旧的图表实例（如果存在）
    if (window._ovCharts) {
      window._ovCharts.forEach(function(c) { if(c) c.destroy(); });
      window._ovCharts = null;
    }

    btn.style.background = 'rgba(255,255,255,.2)';
    btn.style.color = '#fff';
    state.overviewVisible = true;

    // 加载并渲染数据
    loadOverview();
  } else {
    // ── 返回看板：恢复原始HTML ──
    console.log('<<< SWITCHING BACK TO PORTFOLIO');
    if (window._ovCharts) {
      window._ovCharts.forEach(function(c) { if(c) c.destroy(); });
      window._ovCharts = null;
    }
    if (window._portfolioHtml) {
      vp.innerHTML = window._portfolioHtml;
      console.log('Portfolio HTML restored');
      // 恢复后重新渲染数据
      if (typeof renderTable === 'function') renderTable();
    }
    btn.style.background = '';
    btn.style.color = '#c5cae9';
    state.overviewVisible = false;
  }
}

async function loadOverview() {
  console.log('loadOverview called, embedded:', !!window._embeddedOverview);
  // 优先使用内嵌数据（独立版），否则请求API（Flask版）
  if (window._embeddedOverview) {
    console.log('Using embedded data');
    renderOverview(window._embeddedOverview);
    return;
  }
  try {
    console.log('Fetching /api/overview');
    const resp = await fetch('/api/overview');
    const d = await resp.json();
    console.log('Fetched overview data:', d ? 'ok' : 'null');
    renderOverview(d);
  } catch(e) {
    console.error('总览数据加载失败:', e);
    var el = document.getElementById('ovKp1');
    if (el) el.textContent = '加载失败';
  }
}

function renderOverview(d) {
  console.log('=== renderOverview called with data:', d ? Object.keys(d).join(',') : 'null');
  try {
  _ovData = d;
  // 销毁旧图表
  if (_ovCharts) {
    _ovCharts.forEach(function(c) { try { if(c) c.destroy(); } catch(e){} });
  }
  _ovCharts = [];

  // KPI
  const rate = d.total > 0 ? ((d.normal_operation / d.total) * 100).toFixed(1) : '0';
  document.getElementById('ovKp1').textContent = d.total || 0;
  document.getElementById('ovKp2').textContent = rate + '%';
  document.getElementById('ovKp3').textContent = (d.total_capital || 0).toLocaleString('zh-CN',{maximumFractionDigits:0});
  document.getElementById('ovKp4').textContent = (d.scored_count || 0) + ' / ' + (d.avg_score || 0);
  document.getElementById('ovKp5').textContent = d.red_card_count || 0;


  // 隐藏加载指示器
  var loadingEl = document.getElementById('overview-loading');
  if (loadingEl) loadingEl.style.display = 'none';

  console.log('KPI updated ok, loading hidden');

  // 图表
  ovRenderGrade(d);
  ovRenderStage(d);
  ovRenderLevel(d);
  ovRenderStatus(d);
  ovRenderPlatform(d);
  ovRenderRegion(d);
  ovRenderRevenue(d);
  ovRenderTables(d);
  console.log('All charts rendered ok');
  } catch(e) {
    console.error('renderOverview error:', e);
    document.getElementById('ovKp1').textContent = 'ERR:' + e.message;
  }
}

  var filtered = allComps.filter(filterFn);

  var gradeClass = {A:'grade-A',B:'grade-B',C:'grade-C',D:'grade-D',E:'grade-E',F:'grade-F','参股':'grade-参股'};

      '<td style="padding:8px 10px;border-bottom:1px solid #f0f0f0;text-align:center;">' + badge + '</td>' +
      '<td style="padding:8px 10px;border-bottom:1px solid #f0f0f0;text-align:center;color:' + statusColor + ';font-size:12px;">' + status + '</td>' +

    '<div style="display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid #e0e0e0;background:#1a237e;border-radius:12px 12px 0 0;">' +
      '<span style="color:#fff;font-weight:600;font-size:15px;">📋 ' + chartTitle + '（共 ' + filtered.length + ' 家）</span>' +
      '<button onclick="document.getElementById(\'ovDrillModal\').remove()" style="background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:6px;padding:4px 14px;cursor:pointer;font-size:13px;">✕ 关闭</button>' +
    '</div>' +
    '<div style="overflow-y:auto;padding:0;">' +
      '<table style="width:100%;border-collapse:collapse;font-size:13px;">' +
        '<thead><tr style="background:#f5f7fa;position:sticky;top:0;">' +
          '<th style="padding:10px;text-align:left;border-bottom:2px solid #e0e0e0;">公司名称</th>' +
          '<th style="padding:10px;text-align:left;border-bottom:2px solid #e0e0e0;">类别</th>' +

          '<th style="padding:10px;text-align:center;border-bottom:2px solid #e0e0e0;">经营状态</th>' +

// 从总览弹窗中打开公司详情（自动处理视图切换）
function ovOpenCompanyDetail(id) {
  // 1. 关闭弹窗
  var modal = document.getElementById('ovDrillModal');
  if (modal) modal.remove();

  // 2. 如果当前在总览视图，先切回投资看板（overlay/detailPanel 在总览下不在 DOM 中）
  if (state.overviewVisible) {
    toggleOverview(); // 切换回 portfolio，恢复 overlay/detailPanel
    // 等 DOM 恢复后再打开详情
    setTimeout(function() { openDetail(id); }, 300);
  } else {
    openDetail(id);
  }
}

// 预加载全量公司（独立版用 allCompanies，Flask 版从 API 拉取）
function ovEnsureAllCompanies(cb) {
  // 独立版：__DATA__.allCompanies（const 不会挂到 window，直接引用变量）
  if (typeof __DATA__ !== 'undefined' && __DATA__.allCompanies) { cb(__DATA__.allCompanies); return; }
  // 兼容旧字段名
  if (typeof __DATA__ !== 'undefined' && __DATA__.companies) { cb(__DATA__.companies); return; }
  if (window._ovAllCompanies) { cb(window._ovAllCompanies); return; }
  // Flask 版：从 /api/companies 拉取全量
  fetch('/api/companies?limit=500').then(r=>r.json()).then(function(d){
    window._ovAllCompanies = d.data || [];
    cb(window._ovAllCompanies);
  }).catch(function(){ cb([]); });
}

// 通用图表点击处理
function ovChartClick(chartTitle, labelMapper, filterBuilder) {
  return function(evt, elements) {
    if (!elements || !elements.length) return;
    var idx = elements[0].index;
    var chart = elements[0].chart || elements[0]._chart;
    var label = chart ? chart.data.labels[idx] : '';
    var rawLabel = labelMapper ? labelMapper(label) : label;
    var title = chartTitle + ' — ' + label;
    ovEnsureAllCompanies(function(comps) {
      ovDrilldown(title, filterBuilder(rawLabel, label));
    });
  };
}

// ── 评分等级环形图 ──
function ovRenderGrade(d) {
  const gc = d.grade_counts || {};
  const order = ['A','B','C','D','E','F','参股'];
  const labels = [], values = [], colors = [], rawKeys = [];
  order.forEach(k => { if (gc[k] > 0) { labels.push(OV_COLORS.gradeLabels[k]||k); values.push(gc[k]); colors.push(OV_COLORS.grade[k]); rawKeys.push(k); }});
  // 构建 label→rawKey 映射
  var labelToKey = {};
  labels.forEach((l,i) => labelToKey[l] = rawKeys[i]);
  _ovCharts.push(new Chart(document.getElementById('ovChartGrade'), {
    type:'doughnut', data:{labels, datasets:[{data:values, backgroundColor:colors, borderWidth:2, borderColor:'#fff'}]},
    options:{responsive:true, maintainAspectRatio:false,
      plugins:{legend:{position:'right', labels:{padding:14, font:{size:12}, usePointStyle:true}}},
      onClick: function(evt, elements) {
        if (!elements || !elements.length) return;
        var idx = elements[0].index;
        var label = labels[idx];
        var rawKey = labelToKey[label] || label;
        ovEnsureAllCompanies(function(comps) {
          ovDrilldown('评分等级 — ' + label, function(c) {
            if (rawKey === '参股') return c['grade'] === '参股' || (!c['grade'] && c['is_cangu']);
            return c['grade'] === rawKey;
          });
        });
      }
    }
  }));
}

// ── 阶段分布柱状图 ──
function ovRenderStage(d) {
  const sc = d.stage_counts || {};
  const labels = Object.keys(sc), values = Object.values(sc);
  const colors = labels.map(l => OV_COLORS.stage[l]||'#90a4ae');
  _ovCharts.push(new Chart(document.getElementById('ovChartStage'), {
    type:'bar', data:{labels, datasets:[{data:values, backgroundColor:colors, borderRadius:6, barThickness:40}]},
    options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}},
      scales:{y:{beginAtZero:true, ticks:{stepSize:5}, grid:{color:'#f0f0f0'}}},
      onClick: function(evt, elements) {
        if (!elements || !elements.length) return;
        var label = labels[elements[0].index];
        ovEnsureAllCompanies(function(comps) {
          ovDrilldown('发展阶段 — ' + label, function(c) {
            var stg = c['stage'] || '';
            if (label === '参股公司') return stg === '参股公司' || c['is_cangu'];
            return stg === label;
          });
        });
      }
    }
  }));
}

// ── 投资层级 ──
function ovRenderLevel(d) {
  const lc = d.level_distribution || {};
  const entries = Object.entries(lc).sort((a,b)=>b[1]-a[1]);
  _ovCharts.push(new Chart(document.getElementById('ovChartLevel'), {
    type:'bar',
    data:{labels:entries.map(e=>e[0]), datasets:[{data:entries.map(e=>e[1]), backgroundColor:['#1a237e','#3949ab','#7986cb','#ab47bc','#9e9e9e'], borderRadius:6, barThickness:40}]},
    options:{indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}},
      scales:{x:{beginAtZero:true, ticks:{stepSize:10}, grid:{color:'#f0f0f0'}}},
      onClick: function(evt, elements) {
        if (!elements || !elements.length) return;
        var label = entries[elements[0].index][0];
        ovEnsureAllCompanies(function(comps) {
          ovDrilldown('投资层级 — ' + label, function(c) {
            var cat = c['类别'] || '';
            if (label === '参股') return c['is_cangu'] || (cat.includes('参股') && !cat.includes('子公司') && !cat.includes('孙公司'));
            if (label === '分公司') return cat.includes('分公司');
            if (label === '三级及以上') return cat.includes('孙公司之子公司') || cat.includes('孙公司之分公司');
            if (label === '二级孙公司') return cat.includes('孙公司') && !cat.includes('孙公司之');
            if (label === '一级子公司') return !c['is_cangu'] && !cat.includes('参股') && !cat.includes('分公司') && !cat.includes('孙公司');
            return false;
          });
        });
      }
    }
  }));
}

// ── 年收入规模 ──
function ovRenderRevenue(d) {
  const rs = d.revenue_summary || {};
  const rangeOrder = ['2000万以下','2000万-5000万','5000万-1亿','1亿以上','无数据'];
  const revBounds = [
    [null, 2000],
    [2000, 5000],
    [5000, 10000],
    [10000, null],
    null  // 无数据
  ];
  const revColors = ['#bbdefb','#64b5f6','#1e88e5','#0d47a1','#e0e0e0'];
  ['2024','2025','2026'].forEach(year => {
    const canvas = document.getElementById('ovChartRev'+year);
    if (!canvas) return;
    const data = rs[year] || {};
    const values = rangeOrder.map(r => data[r]||0);
    _ovCharts.push(new Chart(canvas, {
      type:'doughnut', data:{labels:rangeOrder, datasets:[{data:values, backgroundColor:revColors, borderWidth:2, borderColor:'#fff'}]},
      options:{responsive:true, maintainAspectRatio:false,
        plugins:{legend:{position:'right', labels:{padding:8, font:{size:11}, usePointStyle:true}}},
        onClick: function(evt, elements) {
          if (!elements || !elements.length) return;
          var idx = elements[0].index;
          var rangeLabel = rangeOrder[idx];
          var bound = revBounds[idx];
          ovEnsureAllCompanies(function(comps) {
            ovDrilldown(year + '年收入 — ' + rangeLabel, function(c) {
              var rev = c.revenue_data ? (c.revenue_data[year] || c.revenue_data[String(year)]) : null;
              if (bound === null) return rev == null || rev === 0 || isNaN(rev);
              var lo = bound[0], hi = bound[1];
              if (rev == null || rev === 0 || isNaN(rev)) return false;
              if (lo === null && hi !== null) return rev < hi;
              if (lo !== null && hi === null) return rev >= lo;
              return rev >= lo && rev < hi;
            });
          });
        }
      }
    }));
  });
}

  });
  document.getElementById('ovCapitalTop').innerHTML = html || '<tr><td colspan="4">暂无数据</td></tr>';

  html = '';

    const rk = i<3 ? 'rank-'+(i+1) : 'rank-other';
    html += `<tr><td><span class="rank-badge ${rk}">${i+1}</span></td><td>${c.name}</td><td style="text-align:right">${(c.revenue||0).toLocaleString('zh-CN',{maximumFractionDigits:0})}</td><td>${c.category||''}</td></tr>`;
  });
  document.getElementById('ovRevenueTop').innerHTML = html || '<tr><td colspan="4">暂无数据</td></tr>';
}

function togglePartnerMonitor() {
  console.log('togglePartnerMonitor called');
  const vp = document.getElementById('view-portfolio');
  const btn = document.getElementById('btnPartners');
  const ovBtn = document.getElementById('btnOverview');

  if (!window._partnersVisible) {
    // ── 进入合资方监控 ──
    if (state.overviewVisible) toggleOverview();  // 先关闭总览
    if (!window._portfolioHtml) {
      window._portfolioHtml = vp.innerHTML;
    }
    vp.innerHTML = window._partnerTemplate;
    btn.style.background = 'rgba(255,255,255,.2)';
    btn.style.color = '#fff';
    ovBtn.style.background = '';
    ovBtn.style.color = '#c5cae9';
    window._partnersVisible = true;
    loadPartners();
  } else {
    // ── 返回看板 ──
    if (window._portfolioHtml) {
      vp.innerHTML = window._portfolioHtml;
      if (typeof renderTable === 'function') renderTable();
    }
    btn.style.background = '';
    btn.style.color = '#c5cae9';
    window._partnersVisible = false;
  }
}

async function loadPartners() {
  console.log('loadPartners called, embedded:', !!window._embeddedPartners);
  if (window._embeddedPartners) {
    renderPartners(window._embeddedPartners);
    return;
  }
  try {
    const resp = await fetch('/api/partners');
    const d = await resp.json();
    renderPartners(d);
  } catch(e) {
    console.error('合资方数据加载失败:', e);
    document.getElementById('pKp1').textContent = '加载失败';
  }
}

function renderPartners(d) {
  const sm = d.summary || {};
  document.getElementById('pKp1').textContent = sm.total_jv || 0;
  document.getElementById('pKp2').textContent = sm.total_partners || 0;
  document.getElementById('pKp3').textContent = sm.company_partners || 0;
  document.getElementById('pKp4').textContent = sm.individual_partners || 0;
  document.getElementById('pKp5').textContent = (sm.high_risk || 0) + (sm.medium_risk || 0);
  document.getElementById('partnerSummary').textContent = '\u66f4\u65b0\uff1a2026-07-01 \u4f01\u67e5\u67e5\u5df2\u67e5\u8be2';

  var riskBars = '';
  if (sm.high_risk > 0) riskBars += '<span style="background:#e53935;color:#fff;padding:2px 8px;border-radius:10px;font-size:11px;margin-right:4px;">\u26a0\ufe0f \u9ad8\u98ce\u9669:' + sm.high_risk + '</span>';
  if (sm.medium_risk > 0) riskBars += '<span style="background:#fb8c00;color:#fff;padding:2px 8px;border-radius:10px;font-size:11px;margin-right:4px;">\ud83d\udccb \u5173\u6ce8:' + sm.medium_risk + '</span>';
  if (sm.checked > 0) riskBars += '<span style="background:#43a047;color:#fff;padding:2px 8px;border-radius:10px;font-size:11px;margin-right:4px;">\u2705 \u6b63\u5e38:' + (sm.checked - (sm.high_risk||0) - (sm.medium_risk||0)) + '</span>';
  if (sm.not_found > 0) riskBars += '<span style="background:#9e9e9e;color:#fff;padding:2px 8px;border-radius:10px;font-size:11px;">\ud83c\udf10 \u5883\u5916:' + sm.not_found + '</span>';
  document.getElementById('partnerRiskBars').innerHTML = riskBars || '<span style="color:#999;font-size:11px;">\u65e0\u98ce\u9669\u63d0\u793a</span>';

  const companies = d.companies || [];
  const riskDetails = [];

  var tbody = '';
  companies.forEach(function(comp) {
    var pCount = comp.partners.length;
    comp.partners.forEach(function(p, idx) {
      var qccLabel = '';
      var qccStyle = '';
      var qccTitle = '';

      if (p.type === '\u516c\u53f8') {
        var lvl = p.qcc_risk_level || 'unknown';
        if (lvl === 'high') {
          qccLabel = '\u26a0\ufe0f \u9ad8\u98ce\u9669';
          qccStyle = 'background:#ffcdd2;color:#c62828;font-weight:700;padding:2px 8px;border-radius:4px;font-size:12px;';
          riskDetails.push(p);
        } else if (lvl === 'medium') {
          qccLabel = '\ud83d\udccb \u5173\u6ce8';
          qccStyle = 'background:#ffe0b2;color:#e65100;font-weight:600;padding:2px 8px;border-radius:4px;font-size:12px;';
          riskDetails.push(p);
        } else if (p.qcc_status === 'not_found') {
          qccLabel = '\ud83c\udf10 \u5883\u5916';
          qccStyle = 'color:#9e9e9e;font-size:12px;';
        } else if (p.qcc_status === 'checked') {
          qccLabel = '\u2705 \u6b63\u5e38';
          qccStyle = 'color:#43a047;font-size:12px;';
        } else {
          qccLabel = '\u231b \u5f85\u67e5\u8be2';
          qccStyle = 'color:#ff9800;font-size:12px;';
        }
        qccTitle = p.qcc_summary || '';
      } else {
        qccLabel = '\u2014';
        qccStyle = 'color:#bbb;';
      }

      var hasDetail = p.type === '\u516c\u53f8' && (p.qcc_risk_level === 'high' || p.qcc_risk_level === 'medium');
      var rowBorder = hasDetail ? 'none' : '1px solid #f0f0f0';
      tbody += '<tr>';
      // 第一行输出带 rowspan 的公司信息；后续行不再重复
      // rowspan 数要加上详情行数
      if (idx === 0) {
        // 计算包含详情行的总行数
        var totalRows = comp.partners.reduce(function(n, pp) {
          return n + 1 + ((pp.type==='\u516c\u53f8' && (pp.qcc_risk_level==='high'||pp.qcc_risk_level==='medium')) ? 1 : 0);
        }, 0);
        tbody += '<td rowspan="' + totalRows + '" style="padding:8px 12px;border-bottom:1px solid #e8eaf6;vertical-align:middle;font-weight:500;">' + comp.company_name + '</td>' +
          '<td rowspan="' + totalRows + '" style="padding:8px 12px;border-bottom:1px solid #e8eaf6;vertical-align:middle;color:#666;font-size:12px;">' + (comp.category||'') + '</td>' +
          '<td rowspan="' + totalRows + '" style="padding:8px 12px;text-align:center;border-bottom:1px solid #e8eaf6;vertical-align:middle;font-weight:600;">' + comp.chengmai_ratio + '%</td>';
      }
      tbody += '<td style="padding:8px 12px;border-bottom:' + rowBorder + ';">' + p.name + '</td>' +
        '<td style="padding:8px 12px;text-align:center;border-bottom:' + rowBorder + ';color:#666;font-size:12px;">' + p.type + '</td>' +
        '<td style="padding:8px 12px;text-align:center;border-bottom:' + rowBorder + ';color:#666;">' + p.ratio + '%</td>' +
        '<td style="padding:8px 12px;text-align:center;border-bottom:' + rowBorder + ';"><span style="' + qccStyle + '">' + qccLabel + '</span></td>' +
        '</tr>';

      // 高风险/关注：追加内联详情行（跨合资方4列）
      if (hasDetail) {
        var isHigh = p.qcc_risk_level === 'high';
        var borderColor = isHigh ? '#e53935' : '#fb8c00';
        var bgColor = isHigh ? '#fff5f5' : '#fff8f0';
        var risks = (p.qcc_risks || []);
        var riskTags = risks.map(function(r) {
          return '<span style="display:inline-block;background:' + (isHigh?'#ffcdd2':'#ffe0b2') + ';color:' + (isHigh?'#c62828':'#e65100') + ';padding:1px 6px;border-radius:3px;font-size:11px;margin:1px 3px 1px 0;">' + r + '</span>';
        }).join('');
        tbody += '<tr style="background:' + bgColor + ';">' +
          '<td colspan="4" style="padding:5px 12px 8px 16px;border-bottom:2px solid ' + borderColor + ';border-left:3px solid ' + borderColor + ';">' +
            '<div style="font-size:12px;color:#444;line-height:1.6;">' + (p.qcc_summary || '') + '</div>' +
            (riskTags ? '<div style="margin-top:3px;">' + riskTags + (p.qcc_last_change ? '<span style="color:#aaa;font-size:11px;margin-left:6px;">\u6700\u8fd1\u53d8\u66f4 ' + p.qcc_last_change + '</span>' : '') + '</div>' : '') +
          '</td>' +
        '</tr>';
      }
    });
  });

  document.getElementById('partnerTableBody').innerHTML = tbody || '<tr><td colspan="7" style="text-align:center;padding:20px;color:#999;">\u6682\u65e0\u6570\u636e</td></tr>';

  // 风险详情列表
  if (riskDetails.length > 0) {
    var riskHtml = '';
    riskDetails.forEach(function(p) {
      var risks = (p.qcc_risks || []).join('\u3001');
      var lvlBadge = p.qcc_risk_level === 'high' ? '\u26a0\ufe0f\u9ad8\u98ce\u9669' : '\ud83d\udccb\u5173\u6ce8';
      riskHtml += '<div class="partner-risk-item" style="padding:10px 12px;border-bottom:1px solid #f0f0f0;border-left:3px solid ' + (p.qcc_risk_level==='high'?'#e53935':'#fb8c00') + ';margin-bottom:4px;background:#fff;">' +
        '<div style="font-weight:600;margin-bottom:4px;">' + p.name + ' <span style="font-size:11px;color:#999;">' + p.ratio + '%</span></div>' +
        '<div style="font-size:12px;color:#666;">' + (p.qcc_summary||'') + '</div>' +
        '<div style="margin-top:4px;">' +
          '<span style="background:'+(p.qcc_risk_level==='high'?'#e53935':'#fb8c00')+';color:#fff;padding:1px 6px;border-radius:3px;font-size:10px;">' + lvlBadge + '</span>' +
          (risks ? ' <span style="font-size:11px;color:#999;">\u2022 ' + risks + '</span>' : '') +
          (p.qcc_last_change ? ' <span style="font-size:11px;color:#999;">\u2022 \u6700\u8fd1\u53d8\u66f4:' + p.qcc_last_change + '</span>' : '') +
          ' <span style="font-size:11px;color:#999;">\u2022 \u5171' + (p.qcc_total_changes||0) + '\u6761\u53d8\u66f4</span>' +
        '</div>' +
        '</div>';
    });
    document.getElementById('partnerRiskDetails').innerHTML = riskHtml;
  } else {
    document.getElementById('partnerRiskDetails').innerHTML = '<div style="padding:20px;text-align:center;color:#999;">\u2705 \u6240\u6709\u5408\u8d44\u65b9\u6682\u65e0\u98ce\u9669\u63d0\u793a</div>';
  }
}
